<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的账户 · 顾客端</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f3f9;
      min-height: 100vh;
      padding: 16px;
      color: #1a1528;
    }
    .app-container { max-width: 480px; margin: 0 auto; }
    /* 顶部用户信息 */
    .user-header {
      background: linear-gradient(135deg, #2d2642, #1e1b2f);
      border-radius: 24px;
      padding: 24px 20px;
      color: white;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px -10px rgba(30, 27, 47, 0.4);
      position: relative;
      overflow: hidden;
    }
    .user-header::after {
      content: "👤";
      position: absolute;
      right: -10px;
      bottom: -20px;
      font-size: 100px;
      opacity: 0.08;
    }
    .user-greeting { font-size: 0.85rem; opacity: 0.8; margin-bottom: 6px; }
    .user-name {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .user-name i { color: #f9e076; font-size: 1.8rem; }
    .user-id {
      font-size: 0.75rem;
      opacity: 0.6;
      margin-top: 8px;
      font-family: monospace;
      background: rgba(255,255,255,0.08);
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
    }
    /* 余额卡片 */
    .balance-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px -4px rgba(88, 28, 135, 0.1);
      border: 1px solid #ede6f7;
    }
    .balance-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .balance-label { font-size: 0.8rem; color: #7e6a9e; font-weight: 500; margin-bottom: 4px; }
    .balance-amount {
      font-size: 2rem;
      font-weight: 800;
      color: #2d2642;
      letter-spacing: -0.03em;
    }
    .balance-amount span { font-size: 1rem; font-weight: 600; color: #8b6fcb; }
    .topup-btn {
      background: linear-gradient(135deg, #8b6fcb, #6b4fa8);
      border: none;
      padding: 12px 20px;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px -4px rgba(139, 111, 203, 0.5);
    }
    .topup-btn:hover { transform: translateY(-2px); }
    /* 待审批提示 */
    .pending-notice {
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 0.8rem;
      color: #8d6e00;
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .pending-notice.show { display: flex; }
    .pending-notice i { font-size: 1.1rem; color: #f9a825; }
    .pending-notice .pending-list {
      margin-top: 6px;
      font-size: 0.75rem;
      line-height: 1.5;
      padding-left: 4px;
    }
    /* Tab切换 */
    .tab-bar {
      display: flex;
      background: white;
      border-radius: 16px;
      padding: 4px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #8b7aa8;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active { background: #2d2642; color: white; }
    /* Voucher列表 */
    .voucher-list { display: flex; flex-direction: column; gap: 14px; }
    .voucher-item {
      background: white;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 4px 16px -6px rgba(88, 28, 135, 0.1);
      border: 1px solid #ede6f7;
      display: flex;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }
    .voucher-item.used { opacity: 0.6; filter: grayscale(0.6); }
    .voucher-item.expired { opacity: 0.5; filter: grayscale(1); }
    .voucher-item::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 5px;
      background: linear-gradient(180deg, #d4af37, #f9e076);
    }
    .voucher-item.used::before { background: #b0b0b0; }
    .voucher-item.expired::before { background: #d0d0d0; }
    .voucher-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: linear-gradient(145deg, #f9f0ff, #ede0ff);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: #8b6fcb;
      flex-shrink: 0;
    }
    .voucher-item.used .voucher-icon,
    .voucher-item.expired .voucher-icon { background: #f0f0f0; color: #999; }
    .voucher-body { flex: 1; min-width: 0; }
    .voucher-amount { font-size: 1.3rem; font-weight: 800; color: #2d2642; }
    .voucher-amount small { font-size: 0.75rem; font-weight: 500; color: #8b6fcb; margin-left: 4px; }
    .voucher-desc { font-size: 0.78rem; color: #7e6a9e; margin-top: 4px; }
    .voucher-code {
      font-family: monospace;
      font-size: 0.75rem;
      background: #f5f0ff;
      color: #6b4fa8;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 8px;
      font-weight: 600;
    }
    .voucher-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 0.7rem;
      color: #9b8bb5;
    }
    .voucher-status {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .status-active { background: #e8f5e9; color: #2e7d32; }
    .status-used { background: #f0f0f0; color: #757575; }
    .status-expired { background: #ffebee; color: #c62828; }
    .use-btn {
      background: linear-gradient(135deg, #2d2642, #1e1b2f);
      border: none;
      padding: 8px 16px;
      border-radius: 30px;
      color: white;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      align-self: center;
    }
    .use-btn:disabled { background: #ccc; cursor: not-allowed; opacity: 0.6; }
    /* 交易历史 */
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 10px -4px rgba(88, 28, 135, 0.08);
      border: 1px solid #f0eaf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-left { display: flex; align-items: center; gap: 12px; }
    .history-icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .icon-topup { background: #e8f5e9; color: #2e7d32; }
    .icon-pending { background: #fff8e1; color: #f9a825; }
    .icon-use { background: #fff3e0; color: #e65100; }
    .icon-receive { background: #e3f2fd; color: #1565c0; }
    .icon-reject { background: #ffebee; color: #c62828; }
    .history-info h4 { font-size: 0.88rem; font-weight: 600; color: #2d2642; }
    .history-info p { font-size: 0.7rem; color: #9b8bb5; margin-top: 2px; }
    .history-amount { font-size: 1rem; font-weight: 700; }
    .history-amount.plus { color: #2e7d32; }
    .history-amount.minus { color: #c62828; }
    .history-amount.pending { color: #f9a825; }
    /* 空状态 */
    .empty-state { text-align: center; padding: 60px 20px; color: #9b8bb5; }
    .empty-state i { font-size: 3rem; margin-bottom: 16px; opacity: 0.4; }
    /* 充值弹窗 */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(30, 27, 47, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
      animation: modalIn 0.2s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      padding: 24px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { font-size: 1.2rem; font-weight: 700; color: #1e1b2f; }
    .modal-close {
      background: none; border: none;
      font-size: 1.4rem; color: #9b8bb5;
      cursor: pointer; padding: 4px;
    }
    .modal-body { padding: 24px; }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #4c3b7a;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1.5px solid #e8e0f0;
      font-size: 1rem;
      font-family: inherit;
      background: #fdfbff;
      font-weight: 600;
    }
    .form-group input:focus {
      outline: none;
      border-color: #8b6fcb;
      background: white;
    }
    .quick-amounts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    .quick-amount {
      padding: 12px;
      border-radius: 12px;
      border: 1.5px solid #e8e0f0;
      background: #fdfbff;
      font-weight: 700;
      font-size: 0.95rem;
      color: #4c3b7a;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-amount:hover { border-color: #8b6fcb; background: #f5f0ff; }
    .quick-amount.selected { background: #2d2642; color: white; border-color: #2d2642; }
    .modal-footer {
      padding: 0 24px 24px;
      display: flex;
      gap: 12px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2d2642, #1e1b2f);
      color: white;
    }
    .btn-outline {
      background: white;
      border: 1.5px solid #e0d4f0;
      color: #4c3b7a;
    }
    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e1b2f;
      color: #f9e076;
      padding: 14px 24px;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.85rem;
      box-shadow: 0 10px 30px -8px rgba(0,0,0,0.4);
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 90%;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border: 1px solid rgba(46, 125, 50, 0.4); }
    .toast.error { border: 1px solid rgba(198, 40, 40, 0.4); color: #ffb3b3; }
    .loading { text-align: center; padding: 40px; color: #8b6fcb; }
    .loading i { font-size: 2rem; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 用户信息 -->
    <div class="user-header">
      <div class="user-greeting">欢迎回来</div>
      <div class="user-name" id="userName">
        <i class="fas fa-user-circle"></i> 加载中...
      </div>
      <div class="user-id" id="userId">ID: ---</div>
    </div>

    <!-- 余额卡片 -->
    <div class="balance-card">
      <div class="balance-top">
        <div>
          <div class="balance-label">账户余额</div>
          <div class="balance-amount" id="userBalance">$0<span>.00</span></div>
        </div>
        <button class="topup-btn" id="topupBtn">
          <i class="fas fa-plus-circle"></i> 申请充值
        </button>
      </div>
    </div>

    <!-- 待审批提示 -->
    <div class="pending-notice" id="pendingNotice">
      <i class="fas fa-hourglass-half"></i>
      <div>
        <strong>有充值申请待审批</strong>
        <div class="pending-list" id="pendingList"></div>
      </div>
    </div>

    <!-- Tab切换 -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="vouchers">
        <i class="fas fa-ticket-alt"></i> 我的礼券
      </button>
      <button class="tab-btn" data-tab="history">
        <i class="fas fa-history"></i> 交易记录
      </button>
    </div>

    <!-- 礼券列表 -->
    <div id="voucherTab">
      <div id="voucherList" class="voucher-list">
        <div class="loading"><i class="fas fa-spinner"></i></div>
      </div>
    </div>

    <!-- 历史记录 -->
    <div id="historyTab" style="display: none;">
      <div id="historyList" class="history-list">
        <div class="loading"><i class="fas fa-spinner"></i></div>
      </div>
    </div>
  </div>

  <!-- 充值申请弹窗 -->
  <div class="modal-overlay" id="topupModal">
    <div class="modal">
      <div class="modal-header">
        <h3><i class="fas fa-wallet" style="color:#8b6fcb; margin-right:8px;"></i>申请充值</h3>
        <button class="modal-close" id="closeTopupModal"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>选择金额</label>
          <div class="quick-amounts">
            <button class="quick-amount" data-amount="50">$50</button>
            <button class="quick-amount" data-amount="100">$100</button>
            <button class="quick-amount" data-amount="200">$200</button>
            <button class="quick-amount" data-amount="500">$500</button>
            <button class="quick-amount" data-amount="1000">$1000</button>
            <button class="quick-amount" data-amount="2000">$2000</button>
          </div>
        </div>
        <div class="form-group">
          <label>自定义金额 ($)</label>
          <input type="number" id="topupAmount" placeholder="输入金额" min="1" step="0.01">
        </div>
        <div style="background:#fff8e1; border-radius:12px; padding:12px; font-size:0.78rem; color:#8d6e00; display:flex; gap:8px;">
          <i class="fas fa-info-circle" style="margin-top:2px;"></i>
          <div>提交后需等待商户审批，审批通过后余额才会到账。</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="cancelTopup">取消</button>
        <button class="btn btn-primary" id="confirmTopup"><i class="fas fa-paper-plane"></i> 提交申请</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    // ============ Firebase ============
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, get, set, push, update, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
      authDomain: "restaurants-cs.firebaseapp.com",
      databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "restaurants-cs",
      storageBucket: "restaurants-cs.firebasestorage.app",
      messagingSenderId: "209872919844",
      appId: "1:209872919844:web:c1730801cd51d615e867b1",
      measurementId: "G-12T3WGM880"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ============ 当前顾客ID（实际项目从登录获取）============
    const CUSTOMER_ID = localStorage.getItem('customerId') || 'customer_001';
    document.getElementById('userId').textContent = `ID: ${CUSTOMER_ID}`;

    // ============ 工具 ============
    function showToast(msg, type = 'info') {
      const t = document.getElementById('toast');
      t.className = 'toast ' + type;
      t.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${msg}`;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function formatDate(ts) {
      if (!ts) return '---';
      const d = new Date(ts);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function formatDateTime(ts) {
      if (!ts) return '---';
      const d = new Date(ts);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    // ============ 加载用户信息 ============
    function loadUserInfo() {
      const userRef = ref(db, `users/${CUSTOMER_ID}`);
      onValue(userRef, (snap) => {
        const data = snap.val();
        if (data) {
          document.getElementById('userName').innerHTML = `<i class="fas fa-user-circle"></i> ${data.name || '尊贵顾客'}`;
          document.getElementById('userBalance').innerHTML = `$${(data.balance || 0).toFixed(2)}<span></span>`;
        } else {
          // 首次访问创建用户
          set(userRef, {
            name: '尊贵顾客',
            balance: 0,
            createdAt: serverTimestamp()
          });
        }
      });
    }

    // ============ 加载待审批的充值申请 ============
    function loadPendingTopups() {
      const pendingRef = ref(db, `users/${CUSTOMER_ID}/topupRequests`);
      onValue(pendingRef, (snap) => {
        const data = snap.val();
        const notice = document.getElementById('pendingNotice');
        const list = document.getElementById('pendingList');
        
        if (!data) {
          notice.classList.remove('show');
          return;
        }

        const pending = Object.entries(data)
          .map(([id, r]) => ({ id, ...r }))
          .filter(r => r.status === 'pending');

        if (pending.length === 0) {
          notice.classList.remove('show');
          return;
        }

        notice.classList.add('show');
        list.innerHTML = pending.map(p => 
          `· $${(p.amount || 0).toFixed(2)} 申请于 ${formatDateTime(p.createdAt)}`
        ).join('<br>');
      });
    }

    // ============ 加载礼券 ============
    function loadVouchers() {
      const list = document.getElementById('voucherList');
      const vouchersRef = ref(db, `users/${CUSTOMER_ID}/vouchers`);
      
      onValue(vouchersRef, (snap) => {
        const data = snap.val();
        list.innerHTML = '';
        
        if (!data) {
          list.innerHTML = `<div class="empty-state"><i class="fas fa-ticket-alt"></i><p>暂无礼券</p></div>`;
          return;
        }

        const now = Date.now();
        const vouchers = Object.entries(data).map(([id, v]) => ({ id, ...v }));
        vouchers.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        vouchers.forEach(v => {
          let status = 'active', statusText = '可用', statusClass = 'status-active';
          if (v.used) { status = 'used'; statusText = '已使用'; statusClass = 'status-used'; }
          else if (v.expiry && v.expiry < now) { status = 'expired'; statusText = '已过期'; statusClass = 'status-expired'; }

          const item = document.createElement('div');
          item.className = `voucher-item ${status}`;
          item.innerHTML = `
            <div class="voucher-icon"><i class="fas fa-gift"></i></div>
            <div class="voucher-body">
              <div class="voucher-amount">$${(v.amount || 0).toFixed(2)} <small>抵扣券</small></div>
              <div class="voucher-desc">${v.description || '满 $' + (v.minSpend || 0) + ' 可用'}</div>
              <div class="voucher-code">${v.code || '----'}</div>
              <div class="voucher-meta">
                <span>有效期至 ${formatDate(v.expiry)}</span>
                <span class="voucher-status ${statusClass}">${statusText}</span>
              </div>
            </div>
            <button class="use-btn" data-id="${v.id}" ${status !== 'active' ? 'disabled' : ''}>
              <i class="fas fa-bolt"></i> 使用
            </button>
          `;
          list.appendChild(item);
        });

        list.querySelectorAll('.use-btn:not([disabled])').forEach(btn => {
          btn.addEventListener('click', () => useVoucher(btn.dataset.id));
        });
      });
    }

    // ============ 使用礼券 ============
    async function useVoucher(voucherId) {
      if (!confirm('确认使用此礼券吗？')) return;
      try {
        const vRef = ref(db, `users/${CUSTOMER_ID}/vouchers/${voucherId}`);
        const snap = await get(vRef);
        const v = snap.val();
        if (!v || v.used) { showToast('礼券不可用', 'error'); return; }

        await update(vRef, { used: true, usedAt: serverTimestamp() });

        // 记录消费历史
        const hRef = ref(db, `users/${CUSTOMER_ID}/history`);
        await push(hRef, {
          type: 'voucher_use',
          voucherId,
          amount: v.amount,
          code: v.code,
          description: `使用礼券 $${v.amount}`,
          createdAt: serverTimestamp()
        });

        showToast(`礼券 $${v.amount} 使用成功！`, 'success');
      } catch (e) {
        console.error(e);
        showToast('使用失败', 'error');
      }
    }

    // ============ 加载交易历史 ============
    function loadHistory() {
      const list = document.getElementById('historyList');
      const hRef = ref(db, `users/${CUSTOMER_ID}/history`);

      onValue(hRef, (snap) => {
        const data = snap.val();
        list.innerHTML = '';

        if (!data) {
          list.innerHTML = `<div class="empty-state"><i class="fas fa-history"></i><p>暂无交易记录</p></div>`;
          return;
        }

        const items = Object.entries(data).map(([id, h]) => ({ id, ...h }));
        items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        items.forEach(h => {
          let iconClass = 'icon-receive', icon = 'fa-gift', prefix = '+', amountClass = 'plus';
          
          if (h.type === 'topup') {
            iconClass = 'icon-topup'; icon = 'fa-plus-circle'; prefix = '+'; amountClass = 'plus';
          } else if (h.type === 'topup_pending') {
            iconClass = 'icon-pending'; icon = 'fa-hourglass-half'; prefix = ''; amountClass = 'pending';
          } else if (h.type === 'topup_rejected') {
            iconClass = 'icon-reject'; icon = 'fa-times-circle'; prefix = ''; amountClass = 'minus';
          } else if (h.type === 'voucher_use' || h.type === 'spend') {
            iconClass = 'icon-use'; icon = 'fa-shopping-bag'; prefix = '-'; amountClass = 'minus';
          }

          const item = document.createElement('div');
          item.className = 'history-item';
          item.innerHTML = `
            <div class="history-left">
              <div class="history-icon ${iconClass}"><i class="fas ${icon}"></i></div>
              <div class="history-info">
                <h4>${h.description || '交易'}</h4>
                <p>${formatDateTime(h.createdAt)}</p>
              </div>
            </div>
            <div class="history-amount ${amountClass}">${prefix}$${Math.abs(h.amount || 0).toFixed(2)}</div>
          `;
          list.appendChild(item);
        });
      });
    }

    // ============ Tab切换 ============
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById('voucherTab').style.display = tab === 'vouchers' ? 'block' : 'none';
        document.getElementById('historyTab').style.display = tab === 'history' ? 'block' : 'none';
      });
    });

    // ============ 充值申请弹窗 ============
    const topupModal = document.getElementById('topupModal');
    const topupAmountInput = document.getElementById('topupAmount');

    document.getElementById('topupBtn').addEventListener('click', () => {
      topupModal.classList.add('show');
      topupAmountInput.value = '';
      document.querySelectorAll('.quick-amount').forEach(b => b.classList.remove('selected'));
    });

    document.getElementById('closeTopupModal').addEventListener('click', () => topupModal.classList.remove('show'));
    document.getElementById('cancelTopup').addEventListener('click', () => topupModal.classList.remove('show'));

    // 快捷金额选择
    document.querySelectorAll('.quick-amount').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.quick-amount').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        topupAmountInput.value = btn.dataset.amount;
      });
    });

    // 提交充值申请
    document.getElementById('confirmTopup').addEventListener('click', async () => {
      const amount = parseFloat(topupAmountInput.value);
      if (!amount || amount <= 0) { showToast('请输入有效金额', 'error'); return; }

      try {
        // 创建充值申请
        const reqRef = ref(db, `users/${CUSTOMER_ID}/topupRequests`);
        const newReqRef = push(reqRef);
        await set(newReqRef, {
          amount,
          status: 'pending',
          createdAt: serverTimestamp()
        });

        // 记录待审批历史
        const hRef = ref(db, `users/${CUSTOMER_ID}/history`);
        await push(hRef, {
          type: 'topup_pending',
          amount,
          requestId: newReqRef.key,
          description: `申请充值 $${amount.toFixed(2)}（待审批）`,
          createdAt: serverTimestamp()
        });

        showToast('充值申请已提交，等待商户审批', 'success');
        topupModal.classList.remove('show');
      } catch (e) {
        console.error(e);
        showToast('提交失败，请重试', 'error');
      }
    });

    // ============ 初始化 ============
    loadUserInfo();
    loadPendingTopups();
    loadVouchers();
    loadHistory();
  </script>
</body>
</html>
