<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>取餐显示 · 顾客/前台屏</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1e1e1e;
            color: #f0f0f0;
            padding: 20px;
            min-height: 100vh;
        }
        .kds-container { max-width: 1600px; margin: 0 auto; }
        
        /* 顶部 Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 15px; padding-bottom: 16px;
            border-bottom: 2px solid #2ecc71; margin-bottom: 24px;
        }
        .header h1 { font-size: 2.2rem; display: flex; align-items: center; gap: 12px; color: #2ecc71; }
        .header h1:before { content: "🛎️"; font-size: 2.5rem; }
        
        .stats {
            background: #2a2a2a; border-radius: 20px; padding: 10px 24px;
            display: inline-flex; gap: 30px; flex-wrap: wrap; font-size: 1.1rem; border: 1px solid #444;
        }
        .stats span { display: inline-flex; align-items: baseline; gap: 8px; }
        .stats .num { font-weight: bold; color: #2ecc71; font-size: 1.4rem; }
        .stats .num.history { color: #3498db; }

        /* 工具栏 */
        .toolbar {
            display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 20px;
        }
        .tabs { display: flex; gap: 8px; }
        .tab-btn {
            background: #2a2a2a; border: 1px solid #444; padding: 10px 20px; border-radius: 40px;
            font-weight: bold; font-size: 1rem; color: #aaa; cursor: pointer; transition: 0.2s;
        }
        .tab-btn.active { background: #2ecc71; color: #1e1e1e; border-color: #2ecc71; }
        
        .search-box {
            flex: 1; min-width: 200px; padding: 10px 16px; border-radius: 40px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 1rem; outline: none;
        }
        .search-box:focus { border-color: #2ecc71; }

        .btn {
            border: none; padding: 10px 20px; border-radius: 40px; font-weight: bold;
            font-size: 1rem; color: #fff; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: #3498db; }
        .btn-primary:hover { background: #2980b9; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }

        /* 视图切换 */
        .view { display: none; }
        .view.active { display: block; }

        /* 待取餐网格 */
        .ready-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px;
        }
        .ready-card {
            background: #2a2a2a; border-radius: 24px; padding: 30px 20px; text-align: center;
            border: 3px solid #2ecc71; box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
            animation: pulse-card 2s infinite; display: flex; flex-direction: column; gap: 15px;
        }
        .ready-label { font-size: 1.5rem; color: #2ecc71; font-weight: bold; }
        .ready-number { font-size: 4.5rem; font-weight: bold; color: #fff; line-height: 1; margin: 10px 0; }
        .ready-items { font-size: 1.1rem; color: #ccc; background: #1e1e1e; padding: 15px; border-radius: 12px; text-align: left; }
        .btn-pickup {
            background: #2ecc71; color: #1e1e1e; border: none; padding: 15px; border-radius: 12px;
            font-size: 1.3rem; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%;
        }
        .btn-pickup:hover { background: #27ae60; transform: scale(1.02); }

        @keyframes pulse-card {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        /* 历史记录表格 */
        .history-table {
            width: 100%; background: #2a2a2a; border-radius: 16px; overflow: hidden; border-collapse: collapse;
        }
        .history-table th, .history-table td {
            padding: 16px; text-align: left; border-bottom: 1px solid #3d3d3d;
        }
        .history-table th { background: #333; color: #aaa; font-weight: 600; }
        .history-table tr:hover { background: #333; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        .badge-picked { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }

        .empty-state {
            text-align: center; padding: 80px 20px; font-size: 1.4rem; color: #666; grid-column: 1 / -1;
        }

        /* Toast 提示 */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #2ecc71; color: #1e1e1e; padding: 12px 30px; border-radius: 50px;
            font-weight: bold; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6); display: none; z-index: 999;
        }
        .toast.error { background: #e74c3c; color: #fff; }

        @media (max-width: 700px) {
            .header h1 { font-size: 1.6rem; }
            .ready-number { font-size: 3rem; }
            .stats { font-size: 0.9rem; gap: 15px; }
        }
    </style>
</head>
<body>
    <div class="kds-container">
        <div class="header">
            <h1>取餐显示 · 顾客/前台屏</h1>
            <div class="stats">
                <span>🟢 待取餐 <span class="num" id="readyCount">0</span></span>
                <span>📜 已取餐 <span class="num history" id="historyCount">0</span></span>
            </div>
        </div>

        <div class="toolbar">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('ready')">🟢 待取餐</button>
                <button class="tab-btn" onclick="switchTab('history')">📜 历史记录</button>
            </div>
            <input type="text" class="search-box" id="searchInput" placeholder="🔍 搜索订单号..." oninput="render()">
            <button class="btn btn-primary" onclick="exportExcel()">📥 下载 Excel</button>
            <button class="btn btn-danger" onclick="clearHistory()">🗑️ 删除全部历史</button>
        </div>

        <!-- 待取餐视图 -->
        <div id="view-ready" class="view active">
            <div id="readyGrid" class="ready-grid">
                <div class="empty-state">🕒 暂无可取餐订单，请耐心等待...</div>
            </div>
        </div>

        <!-- 历史记录视图 -->
        <div id="view-history" class="view">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>订单号</th>
                        <th>桌号/类型</th>
                        <th>商品明细</th>
                        <th>总金额</th>
                        <th>完成时间</th>
                        <th>取餐时间</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <!-- 动态渲染 -->
                </tbody>
            </table>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        // Firebase 配置 (与厨房端完全一致)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyARFD8Zdb7D22XCUJctKM8E-4nVznhqYDc",
            authDomain: "create-for-payment.firebaseapp.com",
            databaseURL: "https://create-for-payment-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "create-for-payment",
            storageBucket: "create-for-payment.firebasestorage.app",
            messagingSenderId: "505063429802",
            appId: "1:505063429802:web:8ec8cca8c788610bad62d3"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const ordersRef = database.ref('orders');

        // ============================================================
        // 全局状态
        // ============================================================
        let allOrders = [];
        let currentTab = 'ready';

        const readyGrid = document.getElementById('readyGrid');
        const historyBody = document.getElementById('historyBody');
        const readyCountEl = document.getElementById('readyCount');
        const historyCountEl = document.getElementById('historyCount');
        const searchInput = document.getElementById('searchInput');
        const toastEl = document.getElementById('toast');

        // ============================================================
        // 工具函数
        // ============================================================
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }

        function formatTime(iso) {
            if (!iso) return '--';
            const d = new Date(iso);
            return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function formatFullTime(iso) {
            if (!iso) return '--';
            const d = new Date(iso);
            return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function showToast(msg, isError = false) {
            toastEl.textContent = msg;
            toastEl.className = 'toast' + (isError ? ' error' : '');
            toastEl.style.display = 'block';
            clearTimeout(toastEl._timer);
            toastEl._timer = setTimeout(() => { toastEl.style.display = 'none'; }, 3000);
        }

        // ============================================================
        // 核心渲染逻辑
        // ============================================================
        function render() {
            // 仅处理 counter 来源的订单
            const counterOrders = allOrders.filter(o => o.source === 'counter');
            
            // 分类
            const readyOrders = counterOrders.filter(o => o.completed === true && o.pickedUp !== true);
            const pickedOrders = counterOrders.filter(o => o.pickedUp === true);

            // 更新统计
            readyCountEl.textContent = readyOrders.length;
            historyCountEl.textContent = pickedOrders.length;

            if (currentTab === 'ready') {
                renderReady(readyOrders);
            } else {
                renderHistory(pickedOrders);
            }
        }

        function renderReady(orders) {
            if (orders.length === 0) {
                readyGrid.innerHTML = '<div class="empty-state">🕒 暂无可取餐订单，请耐心等待...</div>';
                return;
            }

            // 按完成时间降序（最新的在上面）
            orders.sort((a, b) => new Date(b.time) - new Date(a.time));

            readyGrid.innerHTML = orders.map(order => {
                const itemsStr = (order.items || []).map(i => `${i.name || '菜品'} ×${i.qty || 1}`).join('<br>');
                return `
                    <div class="ready-card">
                        <div class="ready-label">🟢 可以取餐</div>
                        <div class="ready-number">#${order.orderNumber || '--'}</div>
                        <div class="ready-items">${itemsStr}</div>
                        <button class="btn-pickup" onclick="markAsPickedUp('${order.id}')">🛍️ 确认顾客已取走</button>
                    </div>
                `;
            }).join('');
        }

        function renderHistory(orders) {
            const searchVal = searchInput.value.trim().toLowerCase();
            let filtered = orders;
            if (searchVal) {
                filtered = orders.filter(o => (o.orderNumber || '').toLowerCase().includes(searchVal));
            }

            if (filtered.length === 0) {
                historyBody.innerHTML = `<tr><td colspan="7" class="empty-state">📭 暂无匹配的历史记录</td></tr>`;
                return;
            }

            // 按取餐时间降序
            filtered.sort((a, b) => new Date(b.pickedUpTime || 0) - new Date(a.pickedUpTime || 0));

            historyBody.innerHTML = filtered.map(order => {
                const itemsStr = (order.items || []).map(i => `${i.name}×${i.qty}`).join(', ');
                return `
                    <tr>
                        <td><strong>#${order.orderNumber || '--'}</strong></td>
                        <td>${escapeHtml(order.table || '外带')}</td>
                        <td>${escapeHtml(itemsStr)}</td>
                        <td style="color:#f1c40f; font-weight:bold;">$${(order.total || 0).toFixed(2)}</td>
                        <td>${formatFullTime(order.completedTime)}</td>
                        <td>${formatFullTime(order.pickedUpTime)}</td>
                        <td><span class="badge badge-picked">已取餐</span></td>
                    </tr>
                `;
            }).join('');
        }

        // ============================================================
        // Firebase 操作
        // ============================================================
        async function markAsPickedUp(id) {
            try {
                const now = new Date().toISOString();
                await ordersRef.child(id).update({ 
                    pickedUp: true, 
                    pickedUpTime: now 
                });
                showToast('✅ 已确认取走');
            } catch (e) {
                showToast('❌ 更新失败: ' + e.message, true);
            }
        }

        async function clearHistory() {
            if (!confirm('⚠️ 确定要删除所有“已取餐”的历史记录吗？\n此操作不可恢复！')) return;
            
            try {
                const snapshot = await ordersRef.orderByChild('source').equalTo('counter').once('value');
                const data = snapshot.val();
                if (!data) return;

                const updates = {};
                let count = 0;
                for (let key in data) {
                    if (data[key].pickedUp === true) {
                        updates[key] = null; // 从数据库删除
                        count++;
                    }
                }

                if (count === 0) {
                    showToast('没有可清除的历史记录');
                    return;
                }

                await ordersRef.update(updates);
                showToast(`✅ 已成功清除 ${count} 条历史记录`);
            } catch (e) {
                showToast('❌ 清除失败: ' + e.message, true);
            }
        }

        // ============================================================
        // 导出 Excel (CSV 格式)
        // ============================================================
        function exportExcel() {
            const pickedOrders = allOrders.filter(o => o.source === 'counter' && o.pickedUp === true);
            if (pickedOrders.length === 0) {
                showToast('❌ 暂无历史记录可导出', true);
                return;
            }

            // 添加 BOM 头 \uFEFF 防止 Excel 打开中文乱码
            let csvContent = "\uFEFF订单号,桌号/类型,商品明细,总金额,完成时间,取餐时间\n";
            
            pickedOrders.forEach(order => {
                const itemsStr = (order.items || []).map(i => `${i.name}x${i.qty}`).join('; ');
                // 用双引号包裹包含逗号的字段，防止 CSV 格式错乱
                const row = [
                    order.orderNumber || '',
                    order.table || '外带',
                    `"${itemsStr}"`,
                    (order.total || 0).toFixed(2),
                    formatFullTime(order.completedTime),
                    formatFullTime(order.pickedUpTime)
                ].join(',');
                csvContent += row + '\n';
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            
            const dateStr = new Date().toLocaleDateString().replace(/\//g, '-');
            link.download = `取餐历史记录_${dateStr}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast('📥 Excel 文件已开始下载');
        }

        // ============================================================
        // UI 交互
        // ============================================================
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`view-${tab}`).classList.add('active');
            render();
        }

        // ============================================================
        // 实时监听 (与厨房端共享同一数据源)
        // ============================================================
        function startListening() {
            const query = ordersRef.orderByChild('source').equalTo('counter');
            query.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    allOrders = [];
                } else {
                    allOrders = Object.entries(data).map(([id, value]) => ({ id, ...value }));
                }
                render();
            }, (error) => {
                console.error('监听失败:', error);
                showToast('❌ 数据库连接异常', true);
            });
        }

        // 启动
        startListening();
    </script>
</body>
</html>
