<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · Setup 总览看板</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-body: #f0f4fb;
            --bg-card: #ffffff;
            --bg-task-hover: #f8faff;
            --text-primary: #0b2b4a;
            --text-secondary: #2d4d6e;
            --text-muted: #6a7e99;
            --text-light: #8a9bb5;
            --border-color: #e2e8f0;
            --shadow-card: 0 8px 28px rgba(0, 20, 50, 0.06);
            --radius-card: 20px;
            --color-primary: #0b2b4a;
            --color-primary-light: #1a4060;
            --color-accent: #c44536;
            --color-success: #1f7b4d;
            --color-success-bg: #d7ede3;
            --color-pending: #b1642a;
            --color-pending-bg: #fff1e0;
            --color-na: #7b8aa0;
            --color-na-bg: #eef2f8;
            --font: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }
        [data-theme="dark"] {
            --bg-body: #111827;
            --bg-card: #1f2937;
            --bg-task-hover: #2a3a4e;
            --text-primary: #e8edf4;
            --text-secondary: #b8c9e0;
            --text-muted: #8a9bb5;
            --text-light: #6a7e99;
            --border-color: #374151;
            --shadow-card: 0 8px 28px rgba(0, 0, 0, 0.3);
            --color-primary: #2a5a7a;
            --color-primary-light: #3a7a9a;
            --color-success: #3a9a6a;
            --color-success-bg: #1a3a2a;
            --color-pending: #d48a4a;
            --color-pending-bg: #3a2a1a;
            --color-na: #6a7e99;
            --color-na-bg: #2a3a4a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-body);
            padding: 20px;
            color: var(--text-primary);
            font-family: var(--font);
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
        }
        .app-container { max-width: 1500px; margin: 0 auto; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        /* Header */
        .header-card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 16px 24px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px 20px;
            margin-bottom: 24px;
        }
        .header-left {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 20px;
        }
        .header-left h1 {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }
        .header-left h1 i { color: var(--color-accent); }
        .badge-editable {
            background: var(--color-primary);
            color: #fff;
            padding: 4px 14px 4px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: default;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 7px 14px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.15s;
            white-space: nowrap;
            font-family: var(--font);
        }
        .btn-icon:hover { background: var(--bg-task-hover); border-color: var(--text-light); }
        .btn-icon.primary { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
        .btn-icon.primary:hover { background: var(--color-primary-light); }
        .btn-icon i { font-size: 14px; }

        /* Stats strip */
        .stats-strip {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 14px 22px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px 28px;
            box-shadow: var(--shadow-card);
        }
        .stats-strip .stat-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .stats-strip .stat-item .num {
            font-weight: 700;
            font-size: 22px;
            color: var(--text-primary);
        }
        .stats-strip .stat-item .label {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 16px;
            margin-bottom: 20px;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 10px 18px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
        }
        .toolbar .search-wrap {
            flex: 1 1 240px;
            display: flex;
            align-items: center;
            background: var(--bg-body);
            border-radius: 40px;
            padding: 0 14px;
            border: 1px solid var(--border-color);
            transition: 0.15s;
        }
        .toolbar .search-wrap:focus-within {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(11, 43, 74, 0.08);
        }
        .search-wrap i { color: var(--text-light); font-size: 14px; }
        .search-wrap input {
            border: none;
            background: transparent;
            padding: 8px 10px;
            font-size: 14px;
            width: 100%;
            outline: none;
            color: var(--text-primary);
        }
        .search-wrap input::placeholder { color: var(--text-light); }

        /* User list */
        .user-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .user-card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            transition: background 0.3s, border-color 0.3s;
        }
        .user-header {
            display: flex;
            align-items: center;
            padding: 14px 22px;
            cursor: pointer;
            gap: 12px;
            flex-wrap: wrap;
            transition: 0.15s;
            user-select: none;
        }
        .user-header:hover { background: var(--bg-task-hover); }
        .user-header .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--color-primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .user-header .user-email {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            word-break: break-all;
        }
        .user-header .user-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .user-header .user-meta .mini-progress {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-header .user-meta .mini-bar {
            width: 80px;
            height: 5px;
            background: var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }
        .user-header .user-meta .mini-bar .fill {
            height: 100%;
            background: var(--color-success);
            border-radius: 10px;
            transition: width 0.3s;
        }
        .user-header .arrow {
            color: var(--text-light);
            transition: transform 0.25s;
            font-size: 13px;
        }
        .user-header.collapsed .arrow { transform: rotate(-90deg); }
        .user-body {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.45s ease, padding 0.3s ease;
            padding: 0 12px 0 12px;
        }
        .user-body.expanded {
            max-height: 3000px;
            padding: 4px 12px 12px 12px;
        }

        /* Task rows inside user card */
        .task-list { display: flex; flex-direction: column; gap: 4px; }
        .task-row {
            background: var(--bg-task-hover);
            border-radius: 12px;
            padding: 8px 14px 8px 18px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 14px;
            border: 1px solid transparent;
            transition: 0.15s;
        }
        .task-row:hover { background: var(--bg-body); border-color: var(--border-color); }
        .task-row .task-index {
            font-weight: 600;
            color: var(--text-light);
            font-size: 12px;
            min-width: 24px;
        }
        .task-row .task-content { flex: 1; min-width: 160px; }
        .task-row .task-title {
            font-weight: 500;
            font-size: 13px;
            color: var(--text-primary);
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
        }
        .task-row .task-title .zh {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 12px;
        }
        .task-row .task-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 12px;
            margin-top: 2px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .task-row .task-meta .dept-tag {
            background: var(--border-color);
            padding: 0 8px;
            border-radius: 40px;
            font-size: 10px;
            color: var(--text-secondary);
        }
        .task-row .task-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            flex-shrink: 0;
        }
        .task-row .status-badge {
            font-size: 11px;
            font-weight: 500;
            padding: 2px 10px;
            border-radius: 40px;
            white-space: nowrap;
            background: var(--color-na-bg);
            color: var(--text-muted);
        }
        .task-row .status-badge.done { background: var(--color-success-bg); color: var(--color-success); }
        .task-row .status-badge.pending { background: var(--color-pending-bg); color: var(--color-pending); }
        .task-row .status-badge.na { background: var(--color-na-bg); color: var(--color-na); }
        .task-row .task-time {
            font-size: 10px;
            color: var(--text-light);
            white-space: nowrap;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            background: var(--bg-card);
            border-radius: var(--radius-card);
            border: 1px solid var(--border-color);
        }
        .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.35; }
        .empty-state p { font-size: 15px; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--color-primary);
            color: #fff;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: 0.3s ease;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 820px) {
            body { padding: 12px; }
            .header-card { padding: 14px 16px; }
            .header-left h1 { font-size: 18px; }
            .user-header { padding: 10px 14px; }
            .user-header .user-meta { margin-left: 0; width: 100%; padding-top: 4px; }
            .user-header .user-email { font-size: 13px; }
            .task-row { padding: 6px 10px; flex-direction: column; align-items: stretch; }
            .task-row .task-status { margin-left: 0; justify-content: flex-start; padding-top: 4px; }
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">
        <!-- Header -->
        <header class="header-card">
            <div class="header-left">
                <h1><i class="fas fa-shield-alt"></i> Admin 总览</h1>
                <span class="badge-editable">
                    <i class="fas fa-users"></i>
                    <span id="totalUsersDisplay">0 位用户</span>
                </span>
            </div>
            <div class="header-actions">
                <button class="btn-icon" id="themeToggle" title="切换主题">
                    <i class="fas fa-moon"></i> <span class="btn-label">主题</span>
                </button>
                <button class="btn-icon" id="refreshBtn" title="刷新数据">
                    <i class="fas fa-sync-alt"></i> <span class="btn-label">刷新</span>
                </button>
                <button class="btn-icon primary" id="logoutBtn" title="退出登录">
                    <i class="fas fa-sign-out-alt"></i> <span class="btn-label">退出</span>
                </button>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats-strip" id="statsStrip">
            <div class="stat-item"><span class="num" id="statUsers">0</span><span class="label">用户总数</span></div>
            <div class="stat-item"><span class="num" id="statTasksTotal">0</span><span class="label">任务条目</span></div>
            <div class="stat-item"><span class="num" id="statTasksDone">0</span><span class="label">已完成</span></div>
            <div class="stat-item"><span class="num" id="statAvgProgress">0</span><span class="label">% 平均进度</span></div>
            <div class="stat-item" style="margin-left:auto;"><span class="label" id="lastRefreshLabel">--</span></div>
        </div>

        <!-- Search -->
        <div class="toolbar">
            <div class="search-wrap">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="搜索用户邮箱或商场名称..." />
            </div>
        </div>

        <!-- User list -->
        <div class="user-list" id="userList"></div>

        <!-- Toast -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== Firebase Config =====
            const firebaseConfig = {
                apiKey: "AIzaSyARFD8Zdb7D22XCUJctKM8E-4nVznhqYDc",
                authDomain: "create-for-payment.firebaseapp.com",
                databaseURL: "https://create-for-payment-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "create-for-payment",
                storageBucket: "create-for-payment.firebasestorage.app",
                messagingSenderId: "505063429802",
                appId: "1:505063429802:web:8ec8cca8c788610bad62d3",
                measurementId: "G-SHP91WNP0H"
            };

            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const db = firebase.database();

            // ===== Task definitions (copy from user app) =====
            const TASKS = [
                { id: 1, en: 'Booking Form Approved / Set up Group chat', zh: '预订表格批准 / 建立群聊', dept: 'Leasing' },
                { id: 2, en: 'Prepare LA', zh: '准备租赁协议', dept: 'Admin' },
                { id: 3, en: 'Collection of Balance SD/ Upfront Entrance Fee', zh: '收取剩余保证金 / 预付入场费', dept: 'Leasing' },
                { id: 4, en: 'Signing of LA', zh: '签署租赁协议', dept: 'Leasing' },
                { id: 5, en: 'JRF - Compile Proposed Menu, 5 items photoshooting, Logo', zh: '整理菜单、拍摄、标志', dept: 'Ops' },
                { id: 6, en: 'Arrange Kitchen Layout / M&E drawing', zh: '安排厨房布局 / 机电图纸', dept: 'Ops' },
                { id: 7, en: 'Approval Kitchen Layout / M&E / Exhaust / Equip Spec', zh: '审批厨房布局/机电/排风', dept: 'Project' },
                { id: 8, en: 'Photoshooting Arrangement', zh: '安排拍摄', dept: 'Branding' },
                { id: 9, en: 'Prepare of Signage Artwork', zh: '准备招牌设计稿', dept: 'Branding' },
                { id: 10, en: 'Prepare of Menu / TM/ Media Clipping Artwork', zh: '准备菜单/商标/媒体稿', dept: 'Branding' },
                { id: 11, en: 'Tenant to review Menu / TM / Signage Artwork', zh: '租户审核菜单/商标/招牌', dept: 'Tenant/Ops' },
                { id: 12, en: 'Melamine/ Takeaway packaging order', zh: '订购密胺餐具 / 外带包装', dept: 'Ops/Tenant' },
                { id: 13, en: 'Equipment Fabrication (Overseas)', zh: '设备制作（海外）', dept: 'Tenant' },
                { id: 14, en: 'SFA / Gas/ Stamp Duty Application', zh: '申请 SFA / 燃气 / 印花税', dept: 'Tenant' },
                { id: 15, en: 'SFA Approval', zh: 'SFA 审批通过', dept: 'Tenant' },
                { id: 16, en: 'Installation 安装工程', zh: '安装工程', dept: 'Install' },
                { id: 17, en: 'Touch Up/ Reinstatement work', zh: '修补 / 复原工程', dept: 'Project/Ops', notRequired: true },
                { id: 18, en: 'Equipment Shift In', zh: '设备进场', dept: 'Tenant/Ops' },
                { id: 19, en: 'Electrical 电力工程', zh: '电力工程', dept: 'Project/Ops' },
                { id: 20, en: 'Gas Meter / Gas Pipe Connection', zh: '燃气表 / 燃气管道', dept: 'Project/Ops', notRequired: true },
                { id: 21, en: 'Plumbing work', zh: '给排水工程', dept: 'Project/Ops/Tenant' },
                { id: 22, en: 'Additional Exhaust Hood/ Grille or Power Upgrade', zh: '额外排风罩/格栅/电力升级', dept: 'Project/Ops', notRequired: true },
                { id: 23, en: 'Signage 招牌安装', zh: '招牌安装', dept: 'Branding' },
                { id: 24, en: 'Menu / Table Menu/ Media clipping', zh: '菜单 / 桌面菜单 / 媒体', dept: 'Branding' },
                { id: 25, en: 'POS Programing', zh: 'POS 系统编程', dept: 'Ops' }
            ];

            const DEPT_COLORS = {
                'Leasing': '#2a5a7a', 'Admin': '#5a6a8a', 'Ops': '#7a6a3a',
                'Project': '#3a6a5a', 'Branding': '#8a4a6a', 'Tenant': '#4a6a7a',
                'Install': '#6a4a3a', 'Tenant/Ops': '#6a6a4a', 'Ops/Tenant': '#6a6a4a',
                'Project/Ops': '#4a6a5a', 'Project/Ops/Tenant': '#4a6a5a'
            };

            // ===== DOM refs =====
            const userListEl = document.getElementById('userList');
            const searchInput = document.getElementById('searchInput');
            const toastEl = document.getElementById('toast');
            const totalUsersDisplay = document.getElementById('totalUsersDisplay');
            const statUsers = document.getElementById('statUsers');
            const statTasksTotal = document.getElementById('statTasksTotal');
            const statTasksDone = document.getElementById('statTasksDone');
            const statAvgProgress = document.getElementById('statAvgProgress');
            const lastRefreshLabel = document.getElementById('lastRefreshLabel');

            // ===== State =====
            let allUsers = [];          // [{ uid, email, data: { doneStatus, doneTimestamps, outletName, ... } }]
            let searchQuery = '';
            let expandedUsers = new Set();   // UIDs of expanded cards
            let theme = 'light';
            let currentAdmin = null;

            // ===== Toast =====
            let toastTimer = null;
            function showToast(msg, duration = 2200) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
            }

            // ===== Theme =====
            function applyTheme(t) {
                theme = t;
                document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
                document.getElementById('themeToggle').innerHTML = t === 'dark'
                    ? '<i class="fas fa-sun"></i> <span class="btn-label">亮色</span>'
                    : '<i class="fas fa-moon"></i> <span class="btn-label">暗色</span>';
            }

            function toggleTheme() {
                applyTheme(theme === 'light' ? 'dark' : 'light');
                showToast(theme === 'light' ? '🌙 暗色模式' : '☀️ 亮色模式');
            }

            // ===== Render helpers =====
            function getFilteredUsers() {
                if (!searchQuery.trim()) return allUsers;
                const q = searchQuery.trim().toLowerCase();
                return allUsers.filter(u => {
                    const email = (u.email || '').toLowerCase();
                    const outlet = (u.data?.outletName || '').toLowerCase();
                    const stall = (u.data?.stallName || '').toLowerCase();
                    return email.includes(q) || outlet.includes(q) || stall.includes(q);
                });
            }

            function computeUserStats(user) {
                const data = user.data || {};
                const doneStatus = data.doneStatus || {};
                let done = 0;
                let total = TASKS.length;
                TASKS.forEach(t => {
                    if (doneStatus[t.id] === true) done++;
                });
                const pct = total > 0 ? Math.round((done / total) * 100) : 0;
                return { done, total, pct };
            }

            function updateGlobalStats() {
                const users = allUsers;
                let totalDone = 0;
                let totalTasks = 0;
                users.forEach(u => {
                    const stats = computeUserStats(u);
                    totalDone += stats.done;
                    totalTasks += stats.total;
                });
                const avg = totalTasks > 0 ? Math.round((totalDone / totalTasks) * 100) : 0;

                statUsers.textContent = users.length;
                statTasksTotal.textContent = totalTasks;
                statTasksDone.textContent = totalDone;
                statAvgProgress.textContent = avg;
                totalUsersDisplay.textContent = users.length + ' 位用户';
                lastRefreshLabel.textContent = '最后刷新: ' + new Date().toLocaleTimeString();
            }

            function buildTaskRow(task, doneStatus, doneTimestamps) {
                const isDone = doneStatus[task.id] === true;
                const isNA = task.notRequired || false;
                const timeStr = doneTimestamps[task.id] || '';
                const statusClass = isDone ? 'done' : (isNA ? 'na' : 'pending');
                const statusText = isDone ? '完成' : (isNA ? '不适用' : '待办');
                const deptColor = DEPT_COLORS[task.dept] || '#5a6a7a';

                return `
                    <div class="task-row" data-task-id="${task.id}">
                        <span class="task-index">${String(task.id).padStart(2, '0')}</span>
                        <div class="task-content">
                            <div class="task-title">
                                <span class="en">${task.en}</span>
                                <span class="zh">${task.zh}</span>
                            </div>
                            <div class="task-meta">
                                <span class="dept-tag" style="background:${deptColor}20;color:${deptColor}">${task.dept}</span>
                                ${isNA ? '<span class="dept-tag" style="background:var(--color-na-bg);color:var(--color-na);">Not Required</span>' : ''}
                            </div>
                        </div>
                        <div class="task-status">
                            <span class="status-badge ${statusClass}">${statusText}</span>
                            ${timeStr ? `<span class="task-time"><i class="far fa-clock"></i> ${timeStr}</span>` : ''}
                        </div>
                    </div>
                `;
            }

            function buildUserCard(user) {
                const data = user.data || {};
                const doneStatus = data.doneStatus || {};
                const doneTimestamps = data.doneTimestamps || {};
                const stats = computeUserStats(user);
                const isExpanded = expandedUsers.has(user.uid);

                const email = user.email || '未知邮箱';
                const avatarLetter = email.charAt(0).toUpperCase();
                const outlet = data.outletName || '未设置商场';
                const stall = data.stallName || '未设置档口';
                const target = data.targetDate || '';

                let tasksHtml = '';
                TASKS.forEach(t => {
                    tasksHtml += buildTaskRow(t, doneStatus, doneTimestamps);
                });

                return `
                    <div class="user-card" data-uid="${user.uid}">
                        <div class="user-header ${isExpanded ? '' : 'collapsed'}" data-uid="${user.uid}">
                            <div class="user-avatar">${avatarLetter}</div>
                            <div>
                                <div class="user-email">${email}</div>
                                <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">
                                    ${outlet} · ${stall}
                                    ${target ? ' · ' + target : ''}
                                </div>
                            </div>
                            <div class="user-meta">
                                <span>${stats.done}/${stats.total} 完成</span>
                                <div class="mini-progress">
                                    <div class="mini-bar"><div class="fill" style="width:${stats.pct}%"></div></div>
                                    <span>${stats.pct}%</span>
                                </div>
                                <span class="arrow"><i class="fas fa-chevron-down"></i></span>
                            </div>
                        </div>
                        <div class="user-body ${isExpanded ? 'expanded' : ''}" data-uid="${user.uid}">
                            <div class="task-list">${tasksHtml}</div>
                        </div>
                    </div>
                `;
            }

            function render() {
                const filtered = getFilteredUsers();
                updateGlobalStats();

                if (filtered.length === 0) {
                    userListEl.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-users-slash"></i>
                            <p>${allUsers.length === 0 ? '暂无注册用户数据' : '没有匹配的用户'}</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                filtered.forEach(u => {
                    html += buildUserCard(u);
                });
                userListEl.innerHTML = html;

                // Attach header toggle
                document.querySelectorAll('.user-header').forEach(header => {
                    header.addEventListener('click', function() {
                        const uid = this.dataset.uid;
                        const body = this.nextElementSibling;
                        const card = this.closest('.user-card');
                        const arrow = this.querySelector('.arrow i');

                        this.classList.toggle('collapsed');
                        body.classList.toggle('expanded');

                        if (body.classList.contains('expanded')) {
                            expandedUsers.add(uid);
                            arrow.className = 'fas fa-chevron-down';
                        } else {
                            expandedUsers.delete(uid);
                            arrow.className = 'fas fa-chevron-right';
                        }
                    });
                });
            }

            // ===== Fetch all users from Firebase =====
            async function fetchAllUsers() {
                try {
                    // Fetch users from Realtime Database under /users
                    const snapshot = await db.ref('users').once('value');
                    const usersData = snapshot.val() || {};

                    const users = [];
                    const uids = Object.keys(usersData);

                    // For each user, get their setupData and email
                    for (const uid of uids) {
                        const userObj = usersData[uid];
                        const setupData = userObj.setupData || {};
                        // Try to get email from auth (only possible for current user) or from stored email
                        let email = userObj.email || '';

                        users.push({
                            uid: uid,
                            email: email || ('User ' + uid.substring(0, 8)),
                            data: setupData
                        });
                    }

                    allUsers = users;
                    render();
                    showToast('✅ 数据已刷新 (' + users.length + ' 位用户)');
                } catch (err) {
                    console.error('Fetch users error:', err);
                    showToast('❌ 读取数据失败: ' + err.message, 3000);
                }
            }

            // ===== Init =====
            function init() {
                // Theme
                applyTheme('light');
                document.getElementById('themeToggle').addEventListener('click', toggleTheme);
                document.getElementById('refreshBtn').addEventListener('click', fetchAllUsers);
                document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

                searchInput.addEventListener('input', function() {
                    searchQuery = this.value;
                    render();
                });

                // Auth: require login (any authenticated user can access admin panel here)
                auth.onAuthStateChanged(async function(user) {
                    if (user) {
                        currentAdmin = user;
                        showToast('欢迎, ' + user.email);
                        await fetchAllUsers();
                    } else {
                        currentAdmin = null;
                        userListEl.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-lock"></i>
                                <p>请先登录以查看管理面板</p>
                                <p style="margin-top:8px;font-size:13px;">请返回用户页面登录，或使用 Firebase Auth 登录</p>
                            </div>
                        `;
                        showToast('🔐 未登录', 3000);
                    }
                });
            }

            document.addEventListener('DOMContentLoaded', init);

        })();
    </script>
</body>
</html>
