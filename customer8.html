<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的账户 · 顾客端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
/* 保留你原有全部样式不变 */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #f5f3f9; min-height: 100vh; padding: 16px; color: #1a1528; }
.app-container { max-width: 480px; margin: 0 auto; }
.auth-screen { display: flex; flex-direction: column; justify-content: center; min-height: calc(100vh - 32px); padding: 20px 0; }
.auth-screen.hidden { display: none; }
.auth-brand { text-align: center; margin-bottom: 32px; }
.auth-logo { width: 72px; height: 72px; border-radius: 24px; background: linear-gradient(135deg, #2d2642, #1e1b2f); display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; color: #f9e076; margin-bottom: 16px; }
.auth-title { font-size: 1.6rem; font-weight: 800; color: #1e1b2f; }
.auth-subtitle { font-size: 0.85rem; color: #8b7aa8; margin-top: 6px; }
.auth-card { background: white; border-radius: 24px; padding: 28px 24px; box-shadow: 0 10px 40px -12px rgba(88, 28, 135, 0.15); border: 1px solid #ede6f7; }
.auth-tabs { display: flex; background: #f5f0ff; border-radius: 14px; padding: 4px; margin-bottom: 24px; }
.auth-tab { flex: 1; padding: 12px; border: none; background: transparent; border-radius: 10px; font-weight: 600; font-size: 0.88rem; color: #8b7aa8; cursor: pointer; transition: all 0.2s; }
.auth-tab.active { background: white; color: #2d2642; }
.auth-form-group { margin-bottom: 16px; }
.auth-form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #4c3b7a; margin-bottom: 6px; }
.auth-form-group input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1.5px solid #e8e0f0; font-size: 0.95rem; background: #fdfbff; }
.auth-form-group input:focus { outline: none; border-color: #8b6fcb; background: white; }
.auth-submit { width: 100%; padding: 16px; border-radius: 16px; border: none; background: linear-gradient(135deg, #2d2642, #1e1b2f); color: white; font-weight: 700; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
.auth-submit:disabled { opacity: 0.6; cursor: not-allowed; }
.auth-error { background: #ffebee; color: #c62828; padding: 12px 16px; border-radius: 12px; display: none; margin-bottom: 16px; }
.auth-error.show { display: block; }
.main-app { display: none; }
.main-app.active { display: block; }
.user-header { background: linear-gradient(135deg, #2d2642, #1e1b2f); border-radius: 24px; padding: 24px 20px; color: white; margin-bottom: 20px; }
.balance-card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 16px -4px rgba(88, 28, 135, 0.1); }
.balance-label { font-size: 0.8rem; color: #7e6a9e; }
.balance-amount { font-size: 2rem; font-weight: 800; color: #2d2642; margin: 8px 0 16px; }
.btn-round { padding: 10px 16px; border-radius: 40px; border: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; margin-right: 8px; margin-bottom: 8px; }
.btn-round.primary { background: linear-gradient(135deg, #8b6fcb, #6b4fa8); color: white; }
.btn-round.secondary { background: #f5f0ff; color: #4c3b7a; }
.tab-bar { display: flex; background: white; border-radius: 16px; padding: 4px; margin-bottom: 20px; }
.tab-btn { flex: 1; padding: 12px; border: none; background: transparent; border-radius: 12px; font-weight: 600; color: #8b7aa8; cursor: pointer; }
.tab-btn.active { background: #2d2642; color: white; }
.voucher-list, .history-list { display: flex; flex-direction: column; gap: 12px; }
.voucher-item, .history-item { background: white; border-radius: 16px; padding: 16px; box-shadow: 0 2px 10px -4px rgba(88, 28, 135, 0.08); }
.modal-overlay { position: fixed; inset: 0; background: rgba(30,27,47,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
.modal-overlay.show { display: flex; }
.modal { background: white; border-radius: 24px; width: 100%; max-width: 420px; padding: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #4c3b7a; margin-bottom: 6px; }
.form-group input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1.5px solid #e8e0f0; font-size: 1rem; }
.btn { width: 100%; padding: 14px; border-radius: 14px; border: none; font-weight: 600; cursor: pointer; margin-top: 8px; }
.btn-primary { background: linear-gradient(135deg, #2d2642, #1e1b2f); color: white; }
.btn-outline { background: white; border: 1.5px solid #e0d4f0; color: #4c3b7a; }
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1e1b2f; color: #f9e076; padding: 14px 24px; border-radius: 60px; opacity: 0; transition: all 0.3s; z-index: 2000; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border: 1px solid rgba(46,125,50,0.4); }
.toast.error { border: 1px solid rgba(198,40,40,0.4); color: #ffb3b3; }
.loading { text-align: center; padding: 40px; color: #8b6fcb; }
.empty { text-align: center; padding: 60px 20px; color: #9b8bb5; }
.scanner-container { width: 100%; border-radius: 16px; overflow: hidden; background: #000; min-height: 280px; }
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
  <div class="app-container">
    <div class="auth-brand">
      <div class="auth-logo"><i class="fas fa-crown"></i></div>
      <div class="auth-title">LUXE & CO.</div>
      <div class="auth-subtitle">顾客会员中心</div>
    </div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">登录</button>
        <button class="auth-tab" id="tabRegister">注册</button>
      </div>
      <div class="auth-error" id="authError"></div>
      
      <!-- 登录表单 -->
      <form id="loginForm">
        <div class="auth-form-group">
          <label>邮箱</label>
          <input type="email" id="loginEmail" placeholder="your@email.com" required>
        </div>
        <div class="auth-form-group">
          <label>密码</label>
          <input type="password" id="loginPassword" placeholder="输入密码" required>
        </div>
        <button type="submit" class="auth-submit" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i> 登录
        </button>
      </form>
      
      <!-- 注册表单 -->
      <form id="registerForm" style="display:none;">
        <div class="auth-form-group">
          <label>邮箱</label>
          <input type="email" id="regEmail" placeholder="your@email.com" required>
        </div>
        <div class="auth-form-group">
          <label>姓名</label>
          <input type="text" id="regName" placeholder="您的姓名" required>
        </div>
        <div class="auth-form-group">
          <label>密码（至少6位）</label>
          <input type="password" id="regPassword" placeholder="设置密码" required minlength="6">
        </div>
        <button type="submit" class="auth-submit" id="registerBtn">
          <i class="fas fa-user-plus"></i> 注册
        </button>
      </form>
    </div>
  </div>
</div>

<div class="main-app" id="mainApp">
  <div class="app-container">
    <div class="user-header">
      <h3 id="welcomeName">欢迎回来</h3>
      <p id="userEmail" style="opacity:0.7; font-size:0.85rem;"></p>
      <button class="btn-round secondary" id="logoutBtn" style="margin-top:12px;">
        <i class="fas fa-sign-out-alt"></i> 退出登录
      </button>
    </div>
    
    <div class="balance-card">
      <div class="balance-label">账户余额</div>
      <div class="balance-amount" id="userBalance">$0.00</div>
      <button class="btn-round primary" id="topupBtn"><i class="fas fa-plus"></i> 申请充值</button>
      <button class="btn-round secondary" id="scanBtn"><i class="fas fa-qrcode"></i> 扫码支付</button>
    </div>
    
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="vouchers">我的礼券</button>
      <button class="tab-btn" data-tab="history">交易记录</button>
    </div>
    
    <div id="voucherTab"><div id="voucherList"></div></div>
    <div id="historyTab" style="display:none;"><div id="historyList"></div></div>
  </div>
</div>

<!-- 充值弹窗 -->
<div class="modal-overlay" id="topupModal">
  <div class="modal">
    <h3 style="margin-bottom:16px;">申请充值</h3>
    <div class="form-group">
      <label>金额 ($)</label>
      <input type="number" id="topupAmount" min="1" step="0.01" placeholder="输入金额">
    </div>
    <button class="btn btn-primary" id="submitTopup">提交申请</button>
    <button class="btn btn-outline" id="closeTopup">取消</button>
  </div>
</div>

<!-- 扫码弹窗 -->
<div class="modal-overlay" id="scanModal">
  <div class="modal">
    <h3 style="margin-bottom:16px;">扫码支付</h3>
    <div class="scanner-container"><div id="qr-reader"></div></div>
    <button class="btn btn-outline" id="closeScan">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getDatabase, ref, set, push, update, get, onValue, runTransaction,
  serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBN3AqJw4LYUaK8BlZduriG7TJsgmRcGY4",
  authDomain: "payment-2084a.firebaseapp.com",
  databaseURL: "https://payment-2084a-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "payment-2084a",
  storageBucket: "payment-2084a.firebasestorage.app",
  messagingSenderId: "320939990652",
  appId: "1:320939990652:web:f7511e1722f34b4af7f3f9",
  measurementId: "G-EV6LQLWTGP"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let unsubs = [];
let qrScanner = null;

function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}
function showError(msg) {
  const e = document.getElementById('authError');
  e.textContent = msg;
  e.classList.add('show');
}
function clearListeners() {
  unsubs.forEach(fn => { try { fn() } catch(e) {} });
  unsubs = [];
}

// 认证状态监听
onAuthStateChanged(auth, user => {
  if (user) {
    currentUser = user;
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.add('active');
    document.getElementById('welcomeName').textContent = `欢迎回来, ${user.displayName || '用户'}`;
    document.getElementById('userEmail').textContent = user.email;
    initUserData();
  } else {
    currentUser = null;
    clearListeners();
    document.getElementById('authScreen').classList.remove('hidden');
    document.getElementById('mainApp').classList.remove('active');
  }
});

// 标签页切换
document.getElementById('tabLogin').addEventListener('click', () => {
  document.getElementById('tabLogin').classList.add('active');
  document.getElementById('tabRegister').classList.remove('active');
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('registerForm').style.display = 'none';
  document.getElementById('authError').classList.remove('show');
});
document.getElementById('tabRegister').addEventListener('click', () => {
  document.getElementById('tabRegister').classList.add('active');
  document.getElementById('tabLogin').classList.remove('active');
  document.getElementById('registerForm').style.display = 'block';
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('authError').classList.remove('show');
});

// 注册
document.getElementById('registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('registerBtn');
  const email = document.getElementById('regEmail').value.trim();
  const name = document.getElementById('regName').value.trim();
  const pwd = document.getElementById('regPassword').value;
  
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 注册中...';
  
  try {
    const userCred = await createUserWithEmailAndPassword(auth, email, pwd);
    // 初始化用户数据
    await set(ref(db, `users/${userCred.user.uid}`), {
      email, name, balance: 0, role: 'customer', createdAt: serverTimestamp()
    });
    // 更新profile显示姓名
    await userCred.user.updateProfile({ displayName: name });
    showToast('注册成功！', 'success');
  } catch (err) {
    showError('注册失败：' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-user-plus"></i> 注册';
  }
});

// 登录
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const email = document.getElementById('loginEmail').value.trim();
  const pwd = document.getElementById('loginPassword').value;
  
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 登录中...';
  
  try {
    await signInWithEmailAndPassword(auth, email, pwd);
    showToast('登录成功！', 'success');
  } catch (err) {
    showError('登录失败：' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 登录';
  }
});

// 退出
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await signOut(auth);
  showToast('已退出', 'success');
});

// 初始化数据监听
function initUserData() {
  const userRef = ref(db, `users/${currentUser.uid}`);
  
  // 余额监听
  unsubs.push(onValue(userRef, snap => {
    const data = snap.val() || {};
    document.getElementById('userBalance').textContent = `$${(data.balance||0).toFixed(2)}`;
  }));
  
  // 礼券监听
  unsubs.push(onValue(ref(db, `users/${currentUser.uid}/vouchers`), snap => {
    renderVouchers(snap.val());
  }));
  
  // 记录监听
  unsubs.push(onValue(ref(db, `users/${currentUser.uid}/history`), snap => {
    renderHistory(snap.val());
  }));
}

// 渲染礼券
function renderVouchers(data) {
  const list = document.getElementById('voucherList');
  if (!data) {
    list.innerHTML = '<div class="empty">暂无礼券</div>';
    return;
  }
  list.innerHTML = Object.values(data).map(v => `
    <div class="voucher-item">
      <h4>$${(v.amount||0).toFixed(2)} 抵扣券</h4>
      <p style="color:#999; font-size:0.8rem;">${v.code || ''}</p>
    </div>
  `).join('');
}

// 渲染记录
function renderHistory(data) {
  const list = document.getElementById('historyList');
  if (!data) {
    list.innerHTML = '<div class="empty">暂无记录</div>';
    return;
  }
  list.innerHTML = Object.values(data).map(h => `
    <div class="history-item">
      <p>${h.description || '交易'}</p>
      <p style="font-weight:bold;">${h.amount >= 0 ? '+' : ''}$${Math.abs(h.amount||0).toFixed(2)}</p>
    </div>
  `).join('');
}

// 充值申请
document.getElementById('topupBtn').addEventListener('click', () => {
  document.getElementById('topupModal').classList.add('show');
});
document.getElementById('closeTopup').addEventListener('click', () => {
  document.getElementById('topupModal').classList.remove('show');
});
document.getElementById('submitTopup').addEventListener('click', async () => {
  const amount = parseFloat(document.getElementById('topupAmount').value);
  if (!amount || amount <= 0) return showToast('请输入有效金额', 'error');
  
  try {
    await push(ref(db, `users/${currentUser.uid}/topupRequests`), {
      amount, status: 'pending', createdAt: serverTimestamp()
    });
    await push(ref(db, `users/${currentUser.uid}/history`), {
      type: 'topup_pending', amount, description: `申请充值 $${amount.toFixed(2)}（待审批）`, createdAt: serverTimestamp()
    });
    showToast('申请已提交', 'success');
    document.getElementById('topupModal').classList.remove('show');
    document.getElementById('topupAmount').value = '';
  } catch (e) {
    showToast('提交失败：' + e.message, 'error');
  }
});

// 扫码支付
document.getElementById('scanBtn').addEventListener('click', async () => {
  document.getElementById('scanModal').classList.add('show');
  if (!qrScanner) qrScanner = new Html5Qrcode('qr-reader');
  try {
    await qrScanner.start(
      { facingMode: 'environment' },
      { fps: 10 },
      async (text) => {
        await qrScanner.stop();
        await processPayment(text);
      },
      () => {}
    );
  } catch (e) {
    showToast('摄像头启动失败', 'error');
    document.getElementById('scanModal').classList.remove('show');
  }
});
document.getElementById('closeScan').addEventListener('click', async () => {
  if (qrScanner) { try { await qrScanner.stop() } catch(e) {} }
  document.getElementById('scanModal').classList.remove('show');
});

// 处理支付
async function processPayment(text) {
  try {
    if (!text.startsWith('PAY:')) throw new Error('无效的收款码');
    const [, amtStr, merchantId] = text.split(':');
    const amount = parseFloat(amtStr);
    if (!amount || amount <= 0) throw new Error('金额无效');
    
    const userRef = ref(db, `users/${currentUser.uid}`);
    const merchantRef = ref(db, `merchants/${merchantId}`);
    
    await runTransaction(db, async tx => {
      const userSnap = await get(userRef);
      const user = userSnap.val() || {};
      const balance = Number(user.balance || 0);
      if (balance < amount) throw new Error('余额不足');
      
      tx.update(userRef, { balance: balance - amount });
      await push(ref(db, `users/${currentUser.uid}/history`), {
        type: 'payment', amount: -amount, description: `支付给商户 ${merchantId}`, createdAt: serverTimestamp()
      });
      
      const merchSnap = await get(merchantRef);
      const merch = merchSnap.val() || {};
      tx.update(merchantRef, { balance: Number(merch.balance || 0) + amount });
      await push(ref(db, `merchants/${merchantId}/history`), {
        type: 'receive', amount, fromUser: currentUser.uid, createdAt: serverTimestamp()
      });
    });
    
    showToast('支付成功！', 'success');
  } catch (e) {
    showToast('支付失败：' + e.message, 'error');
  }
}

// 底部标签切换
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('voucherTab').style.display = btn.dataset.tab === 'vouchers' ? 'block' : 'none';
    document.getElementById('historyTab').style.display = btn.dataset.tab === 'history' ? 'block' : 'none';
  });
});
</script>
</body>
</html>
