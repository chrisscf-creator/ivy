<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商户端 - 收款 & 核销 & 记录管理</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background: #f5f3f9; min-height: 100vh; padding: 20px; }
.container { max-width: 480px; margin: 0 auto; }
.auth-card { background: white; border-radius: 24px; padding: 32px; box-shadow: 0 10px 40px -12px rgba(88,28,135,0.15); margin: 60px auto; }
.auth-card h2 { text-align: center; margin-bottom: 24px; color: #2e7d32; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #2e7d32; }
.form-group input { width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid #e8e0f0; font-size: 1rem; }
.btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; margin-top: 8px; font-size: 1rem; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-primary { background: linear-gradient(135deg, #2d2642, #1e1b2f); color: white; }
.btn-success { background: linear-gradient(135deg, #2e7d32, #1b5e20); color: white; }
.btn-danger { background: linear-gradient(135deg, #c62828, #8e0000); color: white; }
.btn-warning { background: linear-gradient(135deg, #f9a825, #ef6c00); color: white; }
.btn-sm { width: auto; padding: 8px 12px; font-size: 0.85rem; margin: 4px 2px; }
.btn-outline { background: white; border: 1.5px solid #ddd; color: #444; }
.error { background: #ffebee; color: #c62828; padding: 12px; border-radius: 10px; margin-bottom: 16px; display: none; }
.error.show { display: block; }
.main-app { display: none; }
.main-app.active { display: block; }
.header { background: linear-gradient(135deg, #2e7d32, #1b5e20); color: white; padding: 24px; border-radius: 20px; margin-bottom: 20px; }
.balance-section { margin: 12px 0; }
.balance-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 0.95rem; }
.balance-label { opacity: 0.85; }
.balance-value { font-weight: 700; }
.balance-divider { height: 1px; background: rgba(255,255,255,0.2); margin: 8px 0; }
.balance-total { font-size: 1.8rem; font-weight: 800; margin-top: 4px; }
.withdrawable-highlight { color: #ffd54f; font-size: 1.25rem; font-weight: 800; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
.qr-box { background: white; border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 20px; }
#qrCanvas { margin: 0 auto; display: block; }
.scanner-box { background: #000; border-radius: 16px; padding: 16px; margin-bottom: 20px; overflow: hidden; }
#reader { width: 100%; min-height: 300px; }
.tabs { display: flex; background: white; border-radius: 14px; padding: 4px; margin-bottom: 20px; overflow-x: auto; }
.tab { flex: 1; min-width: 90px; padding: 12px 10px; border: none; background: transparent; border-radius: 10px; font-weight: 600; color: #8b7aa8; cursor: pointer; white-space: nowrap; font-size: 0.9rem; }
.tab.active { background: #2e7d32; color: white; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }
.card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 10px -4px rgba(88,28,135,0.08); }
.empty { text-align: center; padding: 40px; color: #999; }
.confirm-modal, .delete-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
.confirm-modal.show, .delete-modal.show { display: flex; }
.modal-content { background: white; border-radius: 20px; padding: 28px; max-width: 380px; width: 100%; }
.modal-amount { font-size: 2.5rem; font-weight: 800; color: #2d2642; text-align: center; margin: 20px 0; }
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1e1b2f; color: #f9e076; padding: 14px 24px; border-radius: 60px; opacity: 0; transition: all 0.3s; z-index: 2000; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-left: 6px; }
.badge-voucher { background: #e8f5e9; color: #2e7d32; }
.badge-balance { background: #e3f2fd; color: #1565c0; }
.badge-cashout { background: #fff3e0; color: #e65100; }
.top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.search-input { padding: 10px 14px; border-radius: 10px; border: 1.5px solid #e8e0f0; flex: 1; min-width: 150px; }
.payment-breakdown { font-size: 0.85rem; color: #666; margin-top: 4px; }
.quick-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.hint-box { background: #fff8e1; border-left: 3px solid #f9a825; padding: 10px 12px; border-radius: 8px; font-size: 0.82rem; color: #8d6e00; margin-bottom: 12px; line-height: 1.5; }
.available-big { font-size: 2rem; font-weight: 800; color: #2e7d32; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
  <!-- 登录界面 -->
  <div class="auth-card" id="authScreen">
    <h2><i class="fas fa-store"></i> 商户登录</h2>
    <div class="error" id="authError"></div>

    <div style="display:flex; gap:8px; margin-bottom:20px;">
      <button class="tab active" id="loginTabBtn" style="flex:1; background: #2e7d32; color: white;">登录</button>
      <button class="tab" id="regTabBtn" style="flex:1;">注册</button>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label>邮箱</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="btn btn-primary">登录</button>
    </form>

    <form id="registerForm" style="display:none;">
      <div class="form-group">
        <label>邮箱</label>
        <input type="email" id="regEmail" required>
      </div>
      <div class="form-group">
        <label>商户名称</label>
        <input type="text" id="merchantName" required>
      </div>
      <div class="form-group">
        <label>密码（至少6位）</label>
        <input type="password" id="regPassword" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary">注册商户</button>
    </form>
  </div>

  <!-- 主界面 -->
  <div class="main-app" id="mainApp">
    <div class="header">
      <h3>欢迎, <span id="merchantNameDisplay">商户</span></h3>
      <p style="opacity:0.8; font-size:0.9rem; margin:4px 0;" id="merchantEmailDisplay"></p>

      <div class="balance-section">
        <div class="balance-row">
          <span class="balance-label"><i class="fas fa-ticket-alt"></i> 礼券收入</span>
          <span class="balance-value" id="voucherBalanceDisplay">$0.00</span>
        </div>
        <div class="balance-row">
          <span class="balance-label"><i class="fas fa-wallet"></i> 现金收入</span>
          <span class="balance-value" id="cashBalanceDisplay">$0.00</span>
        </div>
        <div class="balance-divider"></div>
        <div class="balance-row" id="withdrawnRow" style="display:none;">
          <span class="balance-label"><i class="fas fa-arrow-circle-up"></i> 已提现</span>
          <span class="balance-value" id="withdrawnDisplay">-$0.00</span>
        </div>
        <div class="balance-row">
          <span class="balance-label"><i class="fas fa-piggy-bank"></i> 可提现余额</span>
          <span class="balance-value withdrawable-highlight" id="withdrawableBalanceDisplay">$0.00</span>
        </div>
        <div class="balance-divider"></div>
        <div class="balance-row balance-total">
          <span class="balance-label"><i class="fas fa-coins"></i> 总收入</span>
          <span class="balance-value" id="totalBalanceDisplay">$0.00</span>
        </div>
      </div>

      <button class="btn-sm" style="background:rgba(255,255,255,0.2); color:white; border:none; border-radius:8px; margin-top:12px;" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i> 退出登录
      </button>
    </div>

    <div class="tabs">
      <button class="tab active" data-pane="receive">收款码</button>
      <button class="tab" data-pane="scan">扫码核销</button>
      <button class="tab" data-pane="history">交易记录</button>
      <button class="tab" data-pane="cashout">提现</button>
    </div>

    <!-- 收款码 -->
    <div class="tab-pane active" id="pane-receive">
      <div class="form-group">
        <label>收款金额 ($)</label>
        <input type="number" id="amountInput" min="0.01" step="0.01" placeholder="输入金额生成收款码">
      </div>
      <button class="btn btn-success" id="generateQrBtn">生成收款码</button>
      <div class="qr-box" id="qrContainer" style="display:none;">
        <p style="font-weight:600; margin-bottom:12px;">请顾客扫码支付</p>
        <canvas id="qrCanvas"></canvas>
        <p style="margin-top:12px; font-size:1.1rem; font-weight:bold; color:#2e7d32;" id="qrAmountText"></p>
      </div>
    </div>

    <!-- 扫码核销 -->
    <div class="tab-pane" id="pane-scan">
      <div class="scanner-box">
        <div id="reader"></div>
      </div>
      <button class="btn btn-success" id="startScanBtn">
        <i class="fas fa-qrcode"></i> 开启扫码
      </button>
      <button class="btn" style="background:#ddd; display:none;" id="stopScanBtn">
        <i class="fas fa-stop"></i> 停止扫码
      </button>
      <p style="text-align:center; margin-top:12px; color:#666; font-size:0.9rem;">
        扫描顾客付款码/礼券码
      </p>
    </div>

    <!-- 交易记录 -->
    <div class="tab-pane" id="pane-history">
      <div class="top-bar">
        <h3>交易记录</h3>
        <div style="display:flex; gap:6px;">
          <button class="btn-sm btn-success" id="exportAllBtn">
            <i class="fas fa-download"></i> 导出
          </button>
          <button class="btn-sm btn-danger" id="clearAllBtn">
            <i class="fas fa-trash"></i> 清空
          </button>
        </div>
      </div>
      <input type="text" class="search-input" id="historySearch" placeholder="搜索描述/金额..." style="margin-bottom:12px;">
      <div id="historyList"></div>
    </div>

    <!-- 提现 -->
    <div class="tab-pane" id="pane-cashout">
      <div class="card" style="text-align:center;">
        <p style="color:#666; font-size:0.9rem;"><i class="fas fa-piggy-bank" style="color:#2e7d32;"></i> 可提现余额</p>
        <p class="available-big" id="cashoutAvailable">$0.00</p>
      </div>

      <div class="card">
        <div class="form-group">
          <label>提现金额 ($)</label>
          <input type="number" id="cashoutAmount" min="0.01" step="0.01" placeholder="输入提现金额">
        </div>
        <div class="quick-row">
          <button class="btn-sm btn-outline quick-amount" data-amount="50">$50</button>
          <button class="btn-sm btn-outline quick-amount" data-amount="100">$100</button>
          <button class="btn-sm btn-outline quick-amount" data-amount="500">$500</button>
          <button class="btn-sm btn-outline" id="cashoutAllBtn">全部提现</button>
        </div>
        <div class="hint-box">
          <i class="fas fa-info-circle"></i> 提现金额将从可提现余额中扣除，预计 1-3 个工作日到账至您绑定的银行账户。
        </div>
        <button class="btn btn-warning" id="cashoutBtn">
          <i class="fas fa-hand-holding-usd"></i> 申请提现
        </button>
      </div>

      <h3 style="margin:16px 8px 8px; font-size:1rem; color:#444;"><i class="fas fa-history" style="color:#e65100;"></i> 提现记录</h3>
      <div id="cashoutList"></div>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="confirm-modal" id="confirmModal">
  <div class="modal-content">
    <h3 style="text-align:center;" id="modalTitle">确认收款</h3>
    <p style="text-align:center; color:#666; margin-top:8px;" id="modalSubtext"></p>
    <div class="modal-amount" id="modalAmount">$0.00</div>
    <p style="text-align:center; font-size:0.9rem; color:#888; margin-bottom:16px;" id="modalUserInfo"></p>
    <button class="btn btn-success" id="confirmBtn">确认</button>
    <button class="btn" style="background:#eee; margin-top:8px;" id="closeModalBtn">取消</button>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="delete-modal" id="deleteConfirmModal">
  <div class="modal-content" style="max-width:360px;">
    <h3 style="color:#c62828; text-align:center; margin-bottom:16px;">
      <i class="fas fa-exclamation-triangle"></i> 确认删除
    </h3>
    <p style="text-align:center; margin-bottom:20px;" id="deleteConfirmText">确定要删除此记录吗？<br><strong style="color:#c62828;">此操作不可恢复！</strong></p>
    <div style="display:flex; gap:10px;">
      <button class="btn" style="background:#eee; flex:1;" id="cancelDeleteBtn">取消</button>
      <button class="btn btn-danger" style="flex:1;" id="doDeleteBtn">确认删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getDatabase, ref, set, push, update, get, remove, onValue,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBN3AqJw4LYUaK8BlZduriG7TJsgmRcGY4",
  authDomain: "payment-2084a.firebaseapp.com",
  databaseURL: "https://payment-2084a-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "payment-2084a",
  storageBucket: "payment-2084a.firebasestorage.app",
  messagingSenderId: "320939990652",
  appId: "1:320939990652:web:f7511e1722f34b4af7f3f9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentMerchant = null;
let unsubs = [];
let html5QrCode = null;
let pendingAction = null;
let pendingDeleteKey = null;
let deleteAllMode = false;
let isProcessing = false;
let allHistoryData = {};
let merchantBalance = 0;   // 可提现余额（来自 merchants/{uid}/balance）

function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}
function showError(msg) {
  const e = document.getElementById('authError');
  e.textContent = msg;
  e.classList.add('show');
}
function clearListeners() {
  unsubs.forEach(fn => { try { fn() } catch(e) {} });
  unsubs = [];
}
function formatTime(ts) {
  if (!ts) return '-';
  return new Date(ts).toLocaleString('zh-CN', { hour12: false });
}
function formatMoney(n) { return `$${(n||0).toFixed(2)}`; }
function escapeCsv(s) {
  if (s === null || s === undefined) return '';
  const str = String(s);
  if (/[,"\n]/.test(str)) return `"${str.replace(/"/g, '""')}"`;
  return str;
}

// 同步可提现余额到头部和提现页
function setWithdrawable(n) {
  merchantBalance = Number(n || 0);
  document.getElementById('withdrawableBalanceDisplay').textContent = formatMoney(merchantBalance);
  const el = document.getElementById('cashoutAvailable');
  if (el) el.textContent = formatMoney(merchantBalance);
}

// 计算并更新金额显示（提现记录不计入毛收入）
function updateBalanceDisplay(merchantData, historyData) {
  let voucherTotal = 0;   // 礼券抵扣总额（毛）
  let cashTotal = 0;      // 现金支付总额（毛）
  let withdrawnTotal = 0; // 已提现总额

  if (historyData) {
    Object.values(historyData).forEach(record => {
      if (record.type === 'cash_out') {
        withdrawnTotal += Math.abs(Number(record.amount || 0));
        return;
      }
      voucherTotal += Number(record.voucherAmount || 0);
      cashTotal += Number(record.cashAmount || record.amount || 0);
    });
  }

  const grandTotal = voucherTotal + cashTotal;

  document.getElementById('voucherBalanceDisplay').textContent = formatMoney(voucherTotal);
  document.getElementById('cashBalanceDisplay').textContent = formatMoney(cashTotal);
  document.getElementById('totalBalanceDisplay').textContent = formatMoney(grandTotal);

  const wRow = document.getElementById('withdrawnRow');
  if (wRow) {
    wRow.style.display = withdrawnTotal > 0 ? 'flex' : 'none';
    document.getElementById('withdrawnDisplay').textContent = '-' + formatMoney(withdrawnTotal);
  }
}

// 认证状态
onAuthStateChanged(auth, user => {
  if (user) {
    currentMerchant = user;
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('mainApp').classList.add('active');
    document.getElementById('merchantNameDisplay').textContent = user.displayName || '商户';
    document.getElementById('merchantEmailDisplay').textContent = user.email || '';
    initMerchantData();
  } else {
    stopScanner();
    currentMerchant = null;
    clearListeners();
    document.getElementById('authScreen').style.display = 'block';
    document.getElementById('mainApp').classList.remove('active');
  }
});

// 登录/注册切换
document.getElementById('loginTabBtn').addEventListener('click', () => {
  document.getElementById('loginTabBtn').classList.add('active');
  document.getElementById('loginTabBtn').style.background = '#2e7d32';
  document.getElementById('loginTabBtn').style.color = 'white';
  document.getElementById('regTabBtn').classList.remove('active');
  document.getElementById('regTabBtn').style.background = 'transparent';
  document.getElementById('regTabBtn').style.color = '#8b7aa8';
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('registerForm').style.display = 'none';
  document.getElementById('authError').classList.remove('show');
});
document.getElementById('regTabBtn').addEventListener('click', () => {
  document.getElementById('regTabBtn').classList.add('active');
  document.getElementById('regTabBtn').style.background = '#2e7d32';
  document.getElementById('regTabBtn').style.color = 'white';
  document.getElementById('loginTabBtn').classList.remove('active');
  document.getElementById('loginTabBtn').style.background = 'transparent';
  document.getElementById('loginTabBtn').style.color = '#8b7aa8';
  document.getElementById('registerForm').style.display = 'block';
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('authError').classList.remove('show');
});

// 注册商户
document.getElementById('registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (isProcessing) return;
  isProcessing = true;
  const btn = e.submitter;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 注册中...';
  try {
    const email = document.getElementById('regEmail').value.trim();
    const name = document.getElementById('merchantName').value.trim();
    const pwd = document.getElementById('regPassword').value;
    const userCred = await createUserWithEmailAndPassword(auth, email, pwd);
    await set(ref(db, `merchants/${userCred.user.uid}`), {
      name, email, balance: 0, role: 'merchant', createdAt: serverTimestamp()
    });
    await userCred.user.updateProfile({ displayName: name });
    showToast('商户注册成功！', 'success');
  } catch (err) {
    showError('注册失败：' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '注册商户';
    isProcessing = false;
  }
});

// 登录
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (isProcessing) return;
  isProcessing = true;
  const btn = e.submitter;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 登录中...';
  try {
    const email = document.getElementById('loginEmail').value.trim();
    const pwd = document.getElementById('loginPassword').value;
    await signInWithEmailAndPassword(auth, email, pwd);
    showToast('登录成功！', 'success');
  } catch (err) {
    showError('登录失败：' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '登录';
    isProcessing = false;
  }
});

// 退出
document.getElementById('logoutBtn').addEventListener('click', async () => {
  if (isProcessing) return;
  isProcessing = true;
  stopScanner();
  await signOut(auth);
  showToast('已退出', 'success');
  isProcessing = false;
});

// 加载商户数据：同时监听商户节点（balance）与历史记录
function initMerchantData() {
  unsubs.push(onValue(ref(db, `merchants/${currentMerchant.uid}`), snap => {
    const m = snap.val() || {};
    setWithdrawable(m.balance || 0);
    if (m.name) document.getElementById('merchantNameDisplay').textContent = m.name;
  }));

  unsubs.push(onValue(ref(db, `merchants/${currentMerchant.uid}/history`), snap => {
    allHistoryData = snap.val() || {};
    updateBalanceDisplay(null, allHistoryData);
    renderHistory();
    renderCashoutList();
  }));
}

// 渲染记录 + 搜索过滤
function renderHistory(filter='') {
  const entries = Object.entries(allHistoryData).sort(([,a], [,b]) => (b.createdAt||0)-(a.createdAt||0));
  const f = filter.toLowerCase();
  const filtered = f ? entries.filter(([k,v]) =>
    (v.description||'').toLowerCase().includes(f) ||
    String(v.amount).includes(f)
  ) : entries;

  const container = document.getElementById('historyList');
  if (!filtered.length) {
    container.innerHTML = '<p class="empty">暂无记录</p>';
    return;
  }

  container.innerHTML = filtered.map(([key, h]) => {
    const isVoucher = h.type === 'voucher_redeem';
    const isCashout = h.type === 'cash_out';
    const hasSplit = h.voucherAmount > 0;

    let amountHtml;
    if (isCashout) {
      amountHtml = `<p style="font-weight:bold; color:#c62828; font-size:1.1rem;">-${formatMoney(Math.abs(h.amount))}</p>`;
    } else if (hasSplit) {
      amountHtml = `
        <div class="payment-breakdown">
          ${h.voucherAmount > 0 ? `<span><i class="fas fa-ticket-alt"></i> 礼券: ${formatMoney(h.voucherAmount)}</span>` : ''}
          ${h.cashAmount > 0 ? `<span style="margin-left:10px;"><i class="fas fa-wallet"></i> 余额: ${formatMoney(h.cashAmount)}</span>` : ''}
        </div>
        <p style="font-weight:bold; color:#2e7d32; font-size:1.1rem; margin-top:4px;">合计 ${formatMoney((h.voucherAmount||0) + (h.cashAmount||0))}</p>
      `;
    } else {
      amountHtml = `<p style="font-weight:bold; color:#2e7d32; font-size:1.1rem;">+${formatMoney(h.amount)}</p>`;
    }

    const badgeHtml = isCashout
      ? '<span class="badge badge-cashout">提现</span>'
      : (isVoucher ? '<span class="badge badge-voucher">礼券</span>' : '');

    return `
      <div class="card" style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div style="flex:1;">
          <p>${h.description || '收款'}${badgeHtml}</p>
          ${amountHtml}
          <p style="font-size:0.8rem; color:#888; margin-top:4px;">${formatTime(h.createdAt)}</p>
        </div>
        <button class="btn-sm btn-outline" onclick="askDeleteOne('${key}')">
          <i class="fas fa-trash-alt" style="color:#c62828;"></i>
        </button>
      </div>
    `;
  }).join('');
}

// 渲染提现记录列表
function renderCashoutList() {
  const container = document.getElementById('cashoutList');
  if (!container) return;
  const list = Object.entries(allHistoryData)
    .filter(([, h]) => h.type === 'cash_out')
    .sort(([,a], [,b]) => (b.createdAt||0) - (a.createdAt||0));

  if (!list.length) {
    container.innerHTML = '<p class="empty">暂无提现记录</p>';
    return;
  }

  container.innerHTML = list.map(([key, h]) => `
    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <p><i class="fas fa-money-check-alt" style="color:#e65100;"></i> 提现申请
          <span class="badge badge-cashout">${h.status === 'completed' ? '已到账' : '处理中'}</span>
        </p>
        <p style="font-size:0.8rem; color:#888; margin-top:4px;">${formatTime(h.createdAt)}</p>
      </div>
      <p style="font-weight:bold; color:#c62828; font-size:1.1rem;">-${formatMoney(Math.abs(h.amount))}</p>
    </div>
  `).join('');
}

// 搜索过滤
document.getElementById('historySearch').addEventListener('input', e => {

});

// 导出全部记录为CSV
document.getElementById('exportAllBtn').addEventListener('click', () => {
  if (!Object.keys(allHistoryData).length) {
    showToast('暂无记录可导出', 'error');
    return;
  }
  const header = ['时间', '类型', '总金额', '礼券金额', '余额/现金金额', '描述', '顾客UID', '券码'];
  const rows = Object.entries(allHistoryData).map(([key, h]) => [
    formatTime(h.createdAt),
    h.type === 'voucher_redeem' ? '礼券核销' : (h.type === 'cash_out' ? '提现' : '收款'),
    h.type === 'cash_out' ? h.amount : ((h.voucherAmount || 0) + (h.cashAmount || h.amount || 0)),
    h.voucherAmount || 0,
    h.type === 'cash_out' ? h.amount : (h.cashAmount || h.amount || 0),
    h.description || '',
    h.customerUid || '-',
    h.voucherCode || '-'
  ]);
  const csv = [header, ...rows].map(row => row.map(escapeCsv).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `商户交易记录_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('导出成功', 'success');
});

// 单条删除 - 确认
window.askDeleteOne = function(key) {
  pendingDeleteKey = key;
  deleteAllMode = false;
  document.getElementById('deleteConfirmText').innerHTML =
    '确定要删除这条记录吗？<br><strong style="color:#c62828;">此操作不可恢复！</strong>';
  document.getElementById('deleteConfirmModal').classList.add('show');
};

// 清空全部记录 - 确认
document.getElementById('clearAllBtn').addEventListener('click', () => {
  if (!Object.keys(allHistoryData).length) {
    showToast('暂无记录', 'error');
    return;
  }
  pendingDeleteKey = null;
  deleteAllMode = true;
  document.getElementById('deleteConfirmText').innerHTML =
    '确定要删除<strong>全部</strong>交易记录吗？<br><strong style="color:#c62828;">此操作不可恢复！</strong>';
  document.getElementById('deleteConfirmModal').classList.add('show');
});

// 取消删除
document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
  document.getElementById('deleteConfirmModal').classList.remove('show');
  pendingDeleteKey = null;
  deleteAllMode = false;
});

// 执行删除
document.getElementById('doDeleteBtn').addEventListener('click', async () => {
  if (isProcessing) return;
  isProcessing = true;
  const btn = document.getElementById('doDeleteBtn');
  btn.disabled = true;
  btn.textContent = '删除中...';

  try {
    const historyRef = ref(db, `merchants/${currentMerchant.uid}/history`);
    if (deleteAllMode) {
      await remove(historyRef);
      showToast('✅ 已清空全部记录', 'success');
    } else if (pendingDeleteKey) {
      await remove(ref(db, `merchants/${currentMerchant.uid}/history/${pendingDeleteKey}`));
      showToast('✅ 记录已删除', 'success');
    }
    document.getElementById('deleteConfirmModal').classList.remove('show');
  } catch (e) {
    showToast('删除失败：' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '确认删除';
    pendingDeleteKey = null;
    deleteAllMode = false;
    isProcessing = false;
  }
});

// 扫码功能
document.getElementById('startScanBtn').addEventListener('click', async () => {
  try {
    if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess, () => {}
    );
    document.getElementById('startScanBtn').style.display = 'none';
    document.getElementById('stopScanBtn').style.display = 'block';
    showToast('请扫描顾客二维码', 'info');
  } catch (e) {
    showToast('无法启动摄像头', 'error');
  }
});
document.getElementById('stopScanBtn').addEventListener('click', stopScanner);
function stopScanner() {
  if (html5QrCode?.isScanning) html5QrCode.stop().catch(() => {});
  document.getElementById('startScanBtn').style.display = 'block';
  document.getElementById('stopScanBtn').style.display = 'none';
}

// 扫码成功：同时支持付款码(含礼券+余额)和纯礼券核销码
async function onScanSuccess(decodedText) {
  if (isProcessing) return;
  isProcessing = true;
  stopScanner();

  try {
    // 顾客端组合付款：PAY:总金额:礼券金额:余额金额:顾客UID
    if (decodedText.startsWith('PAY:')) {
      const parts = decodedText.split(':');
      if (parts.length >= 5) {
        const totalAmount = parseFloat(parts[1]);
        const voucherAmount = parseFloat(parts[2]) || 0;
        const cashAmount = parseFloat(parts[3]) || 0;
        const customerUid = parts[4];

        if (voucherAmount > totalAmount || cashAmount > totalAmount || (voucherAmount + cashAmount).toFixed(2) !== totalAmount.toFixed(2)) {
          throw new Error('支付金额数据异常');
        }

        const custSnap = await get(ref(db, `users/${customerUid}`));
        const custData = custSnap.val();
        if (!custData) throw new Error('顾客账号不存在');

        pendingAction = {
          type: 'combined_payment',
          totalAmount, voucherAmount, cashAmount, customerUid,
          customerName: custData.name || '顾客'
        };

        document.getElementById('modalTitle').textContent = '确认收款';
        document.getElementById('modalSubtext').innerHTML =
          (voucherAmount > 0 ? `礼券抵扣 ${formatMoney(voucherAmount)}<br>` : '') +
          (cashAmount > 0 ? `余额支付 ${formatMoney(cashAmount)}` : '');
        document.getElementById('modalAmount').textContent = formatMoney(totalAmount);
        document.getElementById('modalUserInfo').textContent =
          `顾客：${pendingAction.customerName}`;
        document.getElementById('confirmModal').classList.add('show');
      } else {
        throw new Error('请由顾客端扫描商户收款码');
      }
    }
    // 纯礼券核销：VOUCHER:券码:顾客UID
    else if (decodedText.startsWith('VOUCHER:')) {
      const parts = decodedText.split(':');
      if (parts.length < 3) throw new Error('礼券码格式错误');
      const voucherCode = parts[1];
      const customerUid = parts[2];

      const custSnap = await get(ref(db, `users/${customerUid}`));
      const custData = custSnap.val();
      if (!custData) throw new Error('顾客账号不存在');

      const voucher = custData.vouchers?.[voucherCode];
      if (!voucher) throw new Error('礼券不存在');
      if (voucher.used === true) throw new Error('礼券已使用');
      if (voucher.expiry && voucher.expiry < Date.now()) throw new Error('礼券已过期');

      pendingAction = {
        type: 'voucher',
        code: voucherCode, customerUid,
        amount: voucher.amount,
        voucherAmount: voucher.amount,
        cashAmount: 0,
        minSpend: voucher.minSpend || 0,
        customerName: custData.name || '顾客'
      };

      document.getElementById('modalTitle').textContent = '礼券核销确认';
      document.getElementById('modalSubtext').textContent = `券码：${voucherCode}`;
      document.getElementById('modalAmount').textContent = formatMoney(voucher.amount);
      document.getElementById('modalUserInfo').textContent =
        `顾客：${pendingAction.customerName} · 最低消费 ${formatMoney(pendingAction.minSpend)}`;
      document.getElementById('confirmModal').classList.add('show');
    } else {
      throw new Error('无法识别的二维码');
    }
  } catch (e) {
    showToast('扫描失败：' + e.message, 'error');
  } finally {
    isProcessing = false;
  }
}

// 关闭确认弹窗

// 申请提现（打开确认弹窗）
document.getElementById('cashoutBtn').addEventListener('click', () => {
  const amount = parseFloat(document.getElementById('cashoutAmount').value);
  if (!amount || amount <= 0) { showToast('请输入有效提现金额', 'error'); return; }
  if (amount > merchantBalance) { showToast('提现金额超过可提现余额', 'error'); return; }

  pendingAction = { type: 'cashout', amount };
  document.getElementById('modalTitle').textContent = '确认提现';
  document.getElementById('modalSubtext').textContent = '将从可提现余额中扣除';
  document.getElementById('modalAmount').textContent = formatMoney(amount);
  document.getElementById('modalUserInfo').textContent = '预计 1-3 个工作日到账至绑定账户';
  document.getElementById('confirmModal').classList.add('show');
});

// 确认收款/核销/提现
document.getElementById('confirmBtn').addEventListener('click', async () => {
  if (!pendingAction || isProcessing) return;
  isProcessing = true;
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  btn.textContent = '处理中...';

  try {
    if (pendingAction.type === 'combined_payment') {
      // 处理组合支付：礼券+余额
      const { totalAmount, voucherAmount, cashAmount, customerUid, customerName } = pendingAction;

      // 1. 扣除顾客余额
      if (cashAmount > 0) {
        const custSnap = await get(ref(db, `users/${customerUid}`));
        const custData = custSnap.val() || {};
        const newBalance = Number(custData.balance || 0) - cashAmount;
        if (newBalance < 0) throw new Error('顾客余额不足');
        await update(ref(db, `users/${customerUid}`), { balance: newBalance });
      }

      // 2. 标记礼券已使用
      if (voucherAmount > 0 && pendingAction.voucherCode) {
        await update(ref(db, `users/${customerUid}/vouchers/${pendingAction.voucherCode}`), {
          used: true, usedAt: serverTimestamp(), merchantUid: currentMerchant.uid
        });
      }

      // 3. 商户可提现余额只增加实际收到的现金部分
      const merchSnap = await get(ref(db, `merchants/${currentMerchant.uid}`));
      const merchData = merchSnap.val() || {};
      await update(ref(db, `merchants/${currentMerchant.uid}`), {
        balance: Number(merchData.balance || 0) + cashAmount
      });

      // 4. 记录顾客端历史
      await push(ref(db, `users/${customerUid}/history`), {
        type: 'payment', amount: totalAmount, voucherAmount, cashAmount,
        description: `向 ${currentMerchant.displayName || '商户'} 付款`,
        merchantUid: currentMerchant.uid, createdAt: serverTimestamp()
      });

      // 5. 记录商户端历史
      await push(ref(db, `merchants/${currentMerchant.uid}/history`), {
        type: 'combined_payment', amount: totalAmount, voucherAmount, cashAmount,
        description: `顾客 ${customerName} 付款`,
        customerUid, createdAt: serverTimestamp()
      });

      showToast('✅ 收款成功', 'success');
    }
    else if (pendingAction.type === 'voucher') {
      // 纯礼券核销
      await update(ref(db, `users/${pendingAction.customerUid}/vouchers/${pendingAction.code}`), {
        used: true, usedAt: serverTimestamp(), merchantUid: currentMerchant.uid
      });

      await push(ref(db, `users/${pendingAction.customerUid}/history`), {
        type: 'voucher_used', amount: pendingAction.amount,
        voucherAmount: pendingAction.amount, cashAmount: 0,
        description: `在 ${currentMerchant.displayName || '商户'} 使用礼券 ${pendingAction.code}`,
        merchantUid: currentMerchant.uid, createdAt: serverTimestamp()
      });

      await push(ref(db, `merchants/${currentMerchant.uid}/history`), {
        type: 'voucher_redeem', amount: pendingAction.amount,
        voucherAmount: pendingAction.amount, cashAmount: 0,
        description: `顾客 ${pendingAction.customerName} 核销礼券 ${pendingAction.code}`,
        customerUid: pendingAction.customerUid, voucherCode: pendingAction.code,
        createdAt: serverTimestamp()
      });

      showToast('✅ 礼券核销成功', 'success');
    }
    else if (pendingAction.type === 'cashout') {
      // 提现：二次校验余额并扣除，写入提现记录
      const { amount } = pendingAction;
      const merchSnap = await get(ref(db, `merchants/${currentMerchant.uid}`));
      const merchData = merchSnap.val() || {};
      const currentBal = Number(merchData.balance || 0);
      if (amount > currentBal) throw new Error('可提现余额不足');

      await update(ref(db, `merchants/${currentMerchant.uid}`), {
        balance: Number((currentBal - amount).toFixed(2))
      });

      await push(ref(db, `merchants/${currentMerchant.uid}/history`), {
        type: 'cash_out',
        amount: -Number(amount.toFixed(2)),
        cashAmount: -Number(amount.toFixed(2)),
        voucherAmount: 0,
        description: `提现申请 ${formatMoney(amount)}`,
        status: 'pending',
        createdAt: serverTimestamp()
      });

      document.getElementById('cashoutAmount').value = '';
      showToast('✅ 提现申请已提交', 'success');
    }

    document.getElementById('confirmModal').classList.remove('show');
    pendingAction = null;
  } catch (e) {
    showToast('处理失败：' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '确认';
    isProcessing = false;
  }
});
</script>
