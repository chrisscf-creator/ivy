<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>U Pay - 扫码支付</title>
<!--
  ===== Firebase 配置说明（3 步）=====
  1. 去 https://console.firebase.google.com 创建项目 → Authentication → 启用 Phone 登录
  2. 项目设置 → 通用 → 你的应用 → 复制 firebaseConfig，替换下方的 YOUR_API_KEY 等三项
  3. Authentication → 设置 → 授权域名 → 添加你的域名（localhost 默认可用）
  未配置时页面自动进入【演示模式】，验证码会显示在弹窗提示里，不影响测试流程。
-->
<style>
  :root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --green:#16a34a;
    --red:#dc2626;
    --amber:#d97706;
    --bg:#f1f5f9;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
  }
  .hidden{display:none !important;}

  /* ===== 登录/注册 ===== */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{background:var(--card);border-radius:16px;padding:28px 24px;width:100%;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,.08);}
  .auth-card h1{font-size:22px;text-align:center;margin-bottom:4px;}
  .auth-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px;}
  .tabs{display:flex;background:#eef2f7;border-radius:10px;padding:4px;margin-bottom:20px;}
  .tabs button{flex:1;border:none;background:transparent;padding:10px;border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer;}
  .tabs button.active{background:var(--card);color:var(--primary);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .field input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px;outline:none;}
  .field input:focus{border-color:var(--primary);}

  /* 新加坡手机号 +65 前缀输入组 */
  .phone-group{display:flex;gap:8px;}
  .phone-prefix{display:flex;align-items:center;padding:0 14px;border:1px solid var(--border);border-radius:10px;background:#f8fafc;font-size:15px;color:var(--text);font-weight:600;white-space:nowrap;letter-spacing:.5px;}
  .phone-group input{flex:1;}

  .btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;background:var(--primary);color:#fff;}
  .btn:active{background:var(--primary-dark);}
  .btn.green{background:var(--green);}
  .btn.ghost{background:#eef2f7;color:var(--text);}
  .btn.danger{background:var(--red);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .auth-msg{font-size:13px;margin-top:12px;text-align:center;min-height:18px;}
  .auth-msg.err{color:var(--red);}
  .auth-msg.ok{color:var(--green);}

  /* ===== 主界面 ===== */
  .app{max-width:480px;margin:0 auto;padding:16px;padding-bottom:90px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .topbar .greet{font-size:15px;color:var(--muted);}
  .topbar .greet b{display:block;font-size:18px;color:var(--text);}
  .logout{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;}

  .balance-card{background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;border-radius:16px;padding:20px;margin-bottom:14px;}
  .balance-card .label{font-size:13px;opacity:.85;}
  .balance-card .amount{font-size:34px;font-weight:700;margin:6px 0 14px;}
  .balance-card .voucher{font-size:14px;opacity:.95;}

  .banner{background:#fffbeb;border:1px solid #fcd34d;border-radius:12px;padding:14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;}
  .banner .icon{font-size:20px;line-height:1;}
  .banner .txt{flex:1;font-size:13px;color:#78350f;}
  .banner .txt b{display:block;margin-bottom:2px;}
  .banner .bind-btn{background:var(--amber);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px;}
  .tile{background:var(--card);border-radius:14px;padding:18px;text-align:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .tile .emoji{font-size:28px;display:block;margin-bottom:8px;}
  .tile .name{font-size:14px;font-weight:600;}

  .section{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .section h3{font-size:15px;margin-bottom:12px;}
  .scan-area{text-align:center;padding:10px 0;}
  .scan-area p{font-size:13px;color:var(--muted);margin-bottom:12px;}
  .scan-box{width:200px;height:200px;margin:0 auto 12px;border:2px dashed var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;background:#f8fafc;}
  .scan-box.scanning{border-color:var(--green);animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}

  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .row:last-child{border-bottom:none;}
  .row .muted{color:var(--muted);font-size:12px;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:16px 0;}

  .recharge{display:flex;gap:10px;}
  .recharge input{flex:1;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:15px;outline:none;}
  .recharge .btn{width:auto;padding:12px 20px;}

  /* ===== 弹窗 ===== */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-card{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:360px;}
  .modal-card h3{font-size:17px;margin-bottom:14px;text-align:center;}
  .modal-card .amount{text-align:center;font-size:30px;font-weight:700;margin:10px 0 20px;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions .btn{flex:1;}
  .qr-box{width:200px;height:200px;margin:0 auto 16px;background:#f8fafc;border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;}
  .close-x{position:absolute;top:12px;right:16px;background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;max-width:90%;text-align:center;}
  .toast.show{opacity:1;}

  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:50;}
  .bottom-nav button{flex:1;padding:12px 0;background:none;border:none;font-size:12px;color:var(--muted);cursor:pointer;}
  .bottom-nav button.active{color:var(--primary);font-weight:600;}
  .bottom-nav .emoji{display:block;font-size:20px;margin-bottom:2px;}
</style>
</head>
<body>

<!-- ================= 登录 / 注册 ================= -->
<div id="authView" class="auth-wrap">
  <div class="auth-card">
    <h1>U Pay</h1>
    <p class="sub">仅限新加坡手机号（+65）注册登录</p>
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="switchTab('login')">登录</button>
      <button id="tabRegister" onclick="switchTab('register')">注册</button>
    </div>

    <!-- 登录表单 -->
    <div id="loginForm">
      <div class="field">
        <label>新加坡手机号</label>
        <div class="phone-group">
          <div class="phone-prefix">+65</div>
          <input type="tel" id="loginPhone" placeholder="请输入8位手机号" maxlength="8" inputmode="numeric" pattern="[0-9]*">
        </div>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="loginPassword" placeholder="请输入密码">
      </div>
      <button class="btn" onclick="doLogin()">登录</button>
    </div>

    <!-- 注册表单 -->
    <div id="registerForm" class="hidden">
      <div class="field">
        <label>新加坡手机号</label>
        <div class="phone-group">
          <div class="phone-prefix">+65</div>
          <input type="tel" id="regPhone" placeholder="请输入8位手机号" maxlength="8" inputmode="numeric" pattern="[0-9]*">
        </div>
      </div>
      <div class="field">
        <label>姓名</label>
        <input type="text" id="regName" placeholder="请输入姓名">
      </div>
      <div class="field">
        <label>密码（至少6位）</label>
        <input type="password" id="regPassword" placeholder="请输入密码">
      </div>
      <button class="btn" onclick="doRegister()">注册账号</button>
    </div>

    <p id="authMsg" class="auth-msg"></p>
  </div>
</div>

<!-- ================= 主界面 ================= -->
<div id="appView" class="app hidden">
  <div class="topbar">
    <div class="greet">欢迎回来<span id="userName"></span></div>
    <button class="logout" onclick="doLogout()">退出登录</button>
  </div>

  <div class="balance-card">
    <div class="label">账户余额</div>
    <div class="amount" id="balance">$0.00</div>
    <div class="voucher">🎟️ 礼券余额 <span id="voucherBalance">$0.00</span></div>
  </div>

  <!-- 绑定真实手机号 -->
  <div class="banner" id="bindBanner">
    <div class="icon">⚠️</div>
    <div class="txt">
      <b>完善资料：绑定真实手机号</b>
      当前系统识别为临时账户，绑定后后台才能为您发放礼券。
    </div>
    <button class="bind-btn" onclick="openBind()">立即绑定</button>
  </div>

  <div class="grid">
    <div class="tile" onclick="navTo('scan')">
      <span class="emoji">📷</span>
      <span class="name">扫码支付</span>
    </div>
    <div class="tile" onclick="navTo('vouchers')">
      <span class="emoji">🎟️</span>
      <span class="name">我的礼券</span>
    </div>
    <div class="tile" onclick="navTo('history')">
      <span class="emoji">📋</span>
      <span class="name">交易记录</span>
    </div>
    <div class="tile" onclick="navTo('recharge')">
      <span class="emoji">💰</span>
      <span class="name">充值申请</span>
    </div>
  </div>

  <!-- 扫码支付 -->
  <div class="section" id="panel-scan">
    <h3>扫码支付</h3>
    <div class="scan-area">
      <p>扫描商户收款码或礼券核销码完成支付</p>
      <div class="scan-box" id="scanBox">📷 摄像头预览区</div>
      <button class="btn" id="scanBtn" onclick="toggleScan()">开启扫码</button>
    </div>
  </div>

  <!-- 我的礼券 -->
  <div class="section hidden" id="panel-vouchers">
    <h3>我的礼券</h3>
    <div id="voucherList"><p class="empty">暂无礼券</p></div>
  </div>

  <!-- 交易记录 -->
  <div class="section hidden" id="panel-history">
    <h3>交易记录</h3>
    <div id="historyList"><p class="empty">暂无交易记录</p></div>
  </div>

  <!-- 充值申请 -->
  <div class="section hidden" id="panel-recharge">
    <h3>申请充值</h3>
    <div class="recharge">
      <input type="number" id="rechargeAmount" placeholder="充值金额 ($)" min="0" step="0.01">
      <button class="btn" onclick="submitRecharge()">提交申请</button>
    </div>
    <h3 style="margin-top:18px;">申请记录</h3>
    <div id="rechargeList"><p class="empty">暂无申请记录</p></div>
  </div>
</div>

<!-- ================= 底部导航 ================= -->
<div id="bottomNav" class="bottom-nav hidden">
  <button class="active" data-panel="scan" onclick="navTo('scan')"><span class="emoji">📷</span>扫码支付</button>
  <button data-panel="vouchers" onclick="navTo('vouchers')"><span class="emoji">🎟️</span>我的礼券</button>
  <button data-panel="history" onclick="navTo('history')"><span class="emoji">📋</span>交易记录</button>
  <button data-panel="recharge" onclick="navTo('recharge')"><span class="emoji">💰</span>充值申请</button>
</div>

<!-- ================= 绑定手机号弹窗 ================= -->
<div id="bindModal" class="modal hidden">
  <div class="modal-card" style="position:relative;">
    <button class="close-x" onclick="closeBind()">×</button>
    <h3>绑定真实手机号</h3>
    <div class="field">
      <label>新加坡手机号</label>
      <div class="phone-group">
        <div class="phone-prefix">+65</div>
        <input type="tel" id="bindPhone" placeholder="请输入8位手机号" maxlength="8" inputmode="numeric" pattern="[0-9]*">
      </div>
    </div>
    <div class="field">
      <label>验证码</label>
      <div class="recharge">
        <input type="text" id="bindCode" placeholder="请输入6位验证码" maxlength="6" inputmode="numeric">
        <button class="btn ghost" id="sendCodeBtn" onclick="sendCode()">获取验证码</button>
      </div>
    </div>
    <button class="btn" onclick="confirmBind()">确认绑定</button>
  </div>
</div>

<!-- ================= 确认支付弹窗 ================= -->
<div id="payModal" class="modal hidden">
  <div class="modal-card">
    <h3>确认支付</h3>
    <p style="text-align:center;color:var(--muted);font-size:13px;">向商户付款</p>
    <div class="amount" id="payAmount">$0.00</div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closePay()">取消</button>
      <button class="btn" onclick="confirmPay()">确认支付</button>
    </div>
  </div>
</div>

<!-- ================= 礼券核销码弹窗 ================= -->
<div id="redeemModal" class="modal hidden">
  <div class="modal-card">
    <h3>礼券核销码</h3>
    <p style="text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px;">向商户出示此二维码</p>
    <div class="qr-box" id="redeemQr">二维码</div>
    <button class="btn" onclick="closeRedeem()">关闭</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- ===== Firebase SDK（必须在主脚本之前加载）===== -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
/* ============ 新加坡手机号校验：+65 后 8 位数字，以 6/8/9 开头 ============ */
const SG_PHONE = /^[689]\d{7}$/;
function isSGPhone(v){ return SG_PHONE.test(String(v).trim()); }

/* ============ Firebase 初始化（替换成你自己的配置）============ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "your-project.firebaseapp.com",
  projectId: "your-project-id",
};
let firebaseReady = false;
try {
  if(typeof firebase !== 'undefined' && firebaseConfig.apiKey !== 'YOUR_API_KEY'){
    firebase.initializeApp(firebaseConfig);
    firebaseReady = true;
    console.log('[U Pay] Firebase 已启用，短信验证码将真实发送');
  } else {
    console.warn('[U Pay] 未配置 Firebase，当前为演示模式，验证码将显示在提示中');
  }
} catch(e){
  console.warn('[U Pay] Firebase 初始化失败，回退到演示模式：', e);
}

/* ============ 状态 ============ */
let state = {
  loggedIn: false,
  user: null,
  balance: 0,
  voucherBalance: 0,
  phoneBound: false,
  scanning: false,
  vouchers: [],
  history: [],
  recharges: []
};

function loadState(){
  try{
    const s = localStorage.getItem('upay_state');
    if(s) state = {...state, ...JSON.parse(s)};
  }catch(e){}
}
function saveState(){
  try{ localStorage.setItem('upay_state', JSON.stringify(state)); }catch(e){}
}
loadState();

/* ============ 工具 ============ */
function $(id){ return document.getElementById(id); }
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 3000);
}
function fmt(n){ return '$' + Number(n).toFixed(2); }

/* ============ 登录/注册 ============ */
function switchTab(tab){
  $('tabLogin').classList.toggle('active', tab==='login');
  $('tabRegister').classList.toggle('active', tab==='register');
  $('loginForm').classList.toggle('hidden', tab!=='login');
  $('registerForm').classList.toggle('hidden', tab!=='register');
  $('authMsg').textContent = '';
  $('authMsg').className = 'auth-msg';
}
function setAuthMsg(msg, ok){
  const el = $('authMsg');
  el.textContent = msg;
  el.className = 'auth-msg ' + (ok ? 'ok' : 'err');
}
function doLogin(){
  const phone = $('loginPhone').value.trim();
  const pwd = $('loginPassword').value;
  if(!isSGPhone(phone)){ setAuthMsg('请输入正确的新加坡手机号（+65，8位数字，以6/8/9开头）', false); return; }
  if(!pwd){ setAuthMsg('请输入密码', false); return; }
  state.loggedIn = true;
  state.user = { name: '用户' + phone.slice(-4), account: '+65' + phone, phone: '+65' + phone };
  state.balance = 150.00;
  state.voucherBalance = 10.00;
  state.phoneBound = false;
  saveState();
  enterApp();
}
function doRegister(){
  const phone = $('regPhone').value.trim();
  const name = $('regName').value.trim();
  const pwd = $('regPassword').value;
  if(!isSGPhone(phone)){ setAuthMsg('仅支持新加坡手机号（+65，8位数字，以6/8/9开头）', false); return; }
  if(!name){ setAuthMsg('请填写姓名', false); return; }
  if(pwd.length < 6){ setAuthMsg('密码至少6位', false); return; }
  state.loggedIn = true;
  state.user = { name, account: '+65' + phone, phone: '+65' + phone };
  state.balance = 0;
  state.voucherBalance = 0;
  state.phoneBound = false;
  saveState();
  enterApp();
}
function doLogout(){
  state.loggedIn = false;
  state.scanning = false;
  saveState();
  $('appView').classList.add('hidden');
  $('bottomNav').classList.add('hidden');
  $('authView').classList.remove('hidden');
  $('loginPhone').value = '';
  $('loginPassword').value = '';
}

/* ============ 进入主界面 ============ */
function enterApp(){
  $('authView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  $('bottomNav').classList.remove('hidden');
  $('userName').textContent = state.user ? '，' + state.user.name : '';
  $('balance').textContent = fmt(state.balance);
  $('voucherBalance').textContent = fmt(state.voucherBalance);
  $('bindBanner').classList.toggle('hidden', state.phoneBound);
  renderVouchers();
  renderHistory();
  renderRecharges();
  navTo('scan');
}

/* ============ 绑定手机号（Firebase 短信验证码）============ */
let recaptchaVerifier = null;   // Firebase reCAPTCHA 验证器（懒加载）
let confirmationResult = null;  // Firebase 发送后返回的确认对象
let currentSmsCode = null;      // 演示模式下的模拟验证码
let codeTimer = null;

function openBind(){
  $('bindModal').classList.remove('hidden');
  // 弹窗显示后再初始化 reCAPTCHA（避免在 display:none 的元素上渲染失败）
  if(firebaseReady){
    setTimeout(()=>{ try { ensureRecaptcha(); } catch(e){ console.warn(e); } }, 100);
  }
}
function closeBind(){
  $('bindModal').classList.add('hidden');
}
function ensureRecaptcha(){
  if(!recaptchaVerifier && firebaseReady){
    recaptchaVerifier = new firebase.auth.RecaptchaVerifier('sendCodeBtn', {
      size: 'invisible',
      callback: () => { /* reCAPTCHA 验证通过，由 signInWithPhoneNumber 自动继续 */ }
    });
  }
  return recaptchaVerifier;
}
function startCountdown(){
  const btn = $('sendCodeBtn');
  let s = 60;
  btn.disabled = true;
  btn.textContent = s + 's';
  clearInterval(codeTimer);
  codeTimer = setInterval(()=>{
    s--;
    if(s <= 0){
      clearInterval(codeTimer);
      btn.disabled = false;
      btn.textContent = '获取验证码';
    } else {
      btn.textContent = s + 's';
    }
  }, 1000);
}

function sendCode(){
  const phoneRaw = $('bindPhone').value.trim();
  if(!isSGPhone(phoneRaw)){ toast('请输入正确的新加坡手机号（8位数字，以6/8/9开头）'); return; }

  if(firebaseReady){
    // ===== 真实短信模式 =====
    const phone = '+65' + phoneRaw;
    const appVerifier = ensureRecaptcha();
    confirmationResult = null;
    firebase.auth().signInWithPhoneNumber(phone, appVerifier)
      .then(result => {
        confirmationResult = result;
        toast('验证码已发送至 +65 ' + phoneRaw);
        startCountdown();
      })
      .catch(err => {
        console.error('短信发送失败：', err);
        const code = err.code ? err.code.replace('auth/','') : '';
        const msg = {
          'too-many-requests': '请求过于频繁，请稍后再试',
          'invalid-phone-number': '手机号格式无效',
          'captcha-check-failed': '人机验证失败，请刷新重试',
          'quota-exceeded': '短信配额已用完，请升级 Firebase 计划',
          'network-request-failed': '网络错误，请检查连接',
        }[code] || ('发送失败：' + code);
        toast(msg);
        // 失败后重置 reCAPTCHA，允许重试
        if(recaptchaVerifier){ try { recaptchaVerifier.clear(); } catch(e){} recaptchaVerifier = null; }
      });
  } else {
    // ===== 演示模式（未配置 Firebase）：验证码直接显示在提示中 =====
    currentSmsCode = String(Math.floor(100000 + Math.random() * 900000));
    toast('【演示模式】验证码：' + currentSmsCode + '（配置 Firebase 后将真实发送短信）');
    startCountdown();
  }
}

function confirmBind(){
  const phoneRaw = $('bindPhone').value.trim();
  const code = $('bindCode').value.trim();
  if(!isSGPhone(phoneRaw)){ toast('请输入正确的新加坡手机号'); return; }
  if(!code){ toast('请输入验证码'); return; }

  // 绑定成功后的统一处理
  const doBind = () => {
    state.phoneBound = true;
    state.user.phone = '+65' + phoneRaw;
    saveState();
    $('bindBanner').classList.add('hidden');
    closeBind();
    $('bindCode').value = '';
    toast('手机号绑定成功：+65 ' + phoneRaw);
  };

  if(firebaseReady){
    if(!confirmationResult){ toast('请先获取验证码'); return; }
    confirmationResult.confirm(code)
      .then(() => {
        doBind();
        // 登出 Firebase 临时登录态，保持与应用自身登录态独立
        return firebase.auth().signOut().catch(()=>{});
      })
      .catch(() => toast('验证码错误或已过期，请重新获取'));
  } else {
    if(!currentSmsCode){ toast('请先获取验证码'); return; }
    if(code !== currentSmsCode){ toast('验证码错误'); return; }
    currentSmsCode = null;
    doBind();
  }
}

/* ============ 扫码支付 ============ */
function toggleScan(){
  state.scanning = !state.scanning;
  const box = $('scanBox');
  const btn = $('scanBtn');
  if(state.scanning){
    box.classList.add('scanning');
    box.textContent = '📷 正在扫描...';
    btn.textContent = '停止扫码';
    setTimeout(()=>{
      if(state.scanning){
        state.scanning = false;
        box.classList.remove('scanning');
        box.textContent = '📷 摄像头预览区';
        btn.textContent = '开启扫码';
        openPay(25.50);
      }
    }, 2500);
  } else {
    box.classList.remove('scanning');
    box.textContent = '📷 摄像头预览区';
    btn.textContent = '开启扫码';
  }
}

/* ============ 确认支付 ============ */
let pendingAmount = 0;
function openPay(amount){
  pendingAmount = amount;
  $('payAmount').textContent = fmt(amount);
  $('payModal').classList.remove('hidden');
}
function closePay(){
  $('payModal').classList.add('hidden');
}
function confirmPay(){
  if(state.balance < pendingAmount){ toast('余额不足'); closePay(); return; }
  state.balance -= pendingAmount;
  state.history.unshift({
    type: '支付',
    amount: -pendingAmount,
    time: new Date().toLocaleString(),
    desc: '向商户付款'
  });
  saveState();
  $('balance').textContent = fmt(state.balance);
  renderHistory();
  closePay();
  toast('支付成功');
}

/* ============ 礼券核销码 ============ */
function openRedeem(){
  $('redeemModal').classList.remove('hidden');
}
function closeRedeem(){
  $('redeemModal').classList.add('hidden');
}

/* ============ 充值申请 ============ */
function submitRecharge(){
  const amt = parseFloat($('rechargeAmount').value);
  if(!amt || amt <= 0){ toast('请输入正确的充值金额'); return; }
  state.recharges.unshift({
    amount: amt,
    time: new Date().toLocaleString(),
    status: '待审核'
  });
  saveState();
  $('rechargeAmount').value = '';
  renderRecharges();
  toast('充值申请已提交');
}

/* ============ 渲染 ============ */
function renderVouchers(){
  const el = $('voucherList');
  if(!state.vouchers.length){
    el.innerHTML = '<p class="empty">暂无礼券</p>';
    return;
  }
  el.innerHTML = state.vouchers.map(v =>
    `<div class="row"><div>🎟️ ${v.name}<div class="muted">${v.time}</div></div><div>${fmt(v.amount)}</div></div>`
  ).join('');
}
function renderHistory(){
  const el = $('historyList');
  if(!state.history.length){
    el.innerHTML = '<p class="empty">暂无交易记录</p>';
    return;
  }
  el.innerHTML = state.history.map(h =>
    `<div class="row"><div>${h.desc}<div class="muted">${h.time}</div></div><div style="color:${h.amount<0?'var(--red)':'var(--green)'}">${h.amount<0?'-':'+'}${fmt(Math.abs(h.amount))}</div></div>`
  ).join('');
}
function renderRecharges(){
  const el = $('rechargeList');
  if(!state.recharges.length){
    el.innerHTML = '<p class="empty">暂无申请记录</p>';
    return;
  }
  el.innerHTML = state.recharges.map(r =>
    `<div class="row"><div>充值申请<div class="muted">${r.time}</div></div><div>${fmt(r.amount)} · ${r.status}</div></div>`
  ).join('');
}

/* ============ 底部导航 ============ */
function navTo(panel){
  ['scan','vouchers','history','recharge'].forEach(p=>{
    $('panel-'+p).classList.toggle('hidden', p!==panel);
  });
  document.querySelectorAll('#bottomNav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.panel===panel);
  });
}

/* ============ 初始化 ============ */
if(state.loggedIn){
  enterApp();
}
</script>
